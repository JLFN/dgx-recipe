recipe_version: "4"
name: minimax-h3-sol
description: "MiniMax-H3's Sol-Attn acceleration line on the DS4 H3 host: the sparse attention NVIDIA's Sol-H3-Spark reference uses on its second stage (a query-block threshold that routes each 64-token KV block to an exact walk or a pooled-summary fold, one online softmax, training-free), ported into ds4-dfm-rs's native CUDA as h3d_sol_search and h3d_sol_forward, plus the reference's own VSA selection policy for the H3 stage and the video VAE decoder's option arms this campaign measured on a separate branch. This is a documentation line, not a serving recipe: at the pinned engine revision (feat/sol-h3, 72a47033) nothing calls the sparse entry points in production, there is no flag, environment variable or API field that selects them, and the DiT still runs h3d_sdpa at crates/ds4-core/src/minimax_h3/dit.rs:2424. The measured numbers below are kernel-level micro-benchmarks from the engine's own bench binaries on the Spark (2.14x/2.22x/2.40x over dense at the 18,432-token denoise shape, 1.77x at 4,352), not end-to-end renders; no clip has been produced through this path anywhere."
model: /mnt/h3-artifacts/MiniMax-H3
model_layout: partitioned-checkpoint
runtime: ds4-h3-cuda
engine_repo: https://github.com/JLFN/ds4-dfm-rs
engine_version: "the H3 host's feature branch feat/sol-h3, tip 72a470339e8d5622e2a520806d28553aa6f50c79 (the operator's fork JLFN/ds4-dfm-rs; verified 2026-10-28: git ls-remote fork refs/heads/feat/sol-h3 returns that sha, git ls-remote origin refs/heads/feat/sol-h3 returns nothing, and git merge-base --is-ancestor feat/sol-h3 origin/main fails -- the branch is published on the fork, absent from upstream Baekpica/ds4-dfm-rs, and not in its main, so it is not a release line). The branch adds native/h3/h3_dit_gpu.cu entry points h3d_sol_search and h3d_sol_forward, declared in native/h3/h3_dit_gpu.h:474-478 and :507-511. The engine's own docs read the port against the reference at NVIDIA Sana sol-engine @ 6e4a440."
build: make CUDA_ARCH=sm_121 h3-server-rs
context: not_applicable
banks: not_applicable
not_autoregressive: true
api: local-v1-video-contract

env:
  # Nothing here is a serving switch for this path, because none exists: the
  # sparse entry points are reachable only from the engine's own tests and
  # benches, never from h3-server-rs or h3-rs. A grep for H3_SOL, H3_SPARSE,
  # SOL_ATTN or a topk/VSA selector over native/h3 and
  # crates/ds4-core/src/minimax_h3 returns nothing but a comment.
  #
  # The shared launcher's own variables, unchanged by this recipe (the H3 host
  # takes flags, not environment):
  #   H3_MODEL_DIR    /mnt/h3-artifacts/MiniMax-H3
  #   H3_BIND         0.0.0.0:8090
  #   H3_STEPS        20                 (2 is an execution check)
  #   H3_REUSE        1
  #   H3_MAX_JOBS     8
  #   H3_OUT_DIR      $HOME/h3-videos
  #   H3_STATE_DIR    $HOME/h3-server
  #   H3_GUARD        0                  (1 wraps the server in tools/host_memory_guard.py)
  #
  # The VAE-decode arm DOES have an environment surface, but it belongs to a
  # different, unmerged branch (feat/h3-vae-options): H3_VAE_ATTENTION
  # (scalar|tensor), H3_VAE_SDPA_ORDER (heads|rows), H3_VAE_GEMM
  # (fp32|tf32|bf16), off by default, read once per context in h3d_create. See
  # docs/minimax-h3/vae-options-2026-10-28.md:18-27. Nothing in that option set
  # is on feat/sol-h3 or on the release line.
  H3_STEPS: "20"

metadata:
  author: "${USER}"
  maintainer: "${USER}"
  created: "2026-10-28"
  updated: "2026-10-28"
  tags:
    - minimax
    - minimax-h3
    - h3
    - diffusion-transformer
    - dit
    - sparse-attention
    - sol-attn
    - sol-h3-spark
    - vsa
    - video-sparse-attention
    - vae-decode
    - cuda
    - sm_121
    - spark
    - gb10
    - not-wired
  runbook: runbooks/minimax-h3-sol.md
  launcher: scripts/start-minimax-h3.sh
  source: https://huggingface.co/MiniMaxAI/MiniMax-H3
  revision: 42ed227ee7df40d41602854ae760620d6eb651fe
  revision_note: "the same checkpoint, at the same revision, as recipes/minimax-h3.yaml: this path changes the attention walk, not the weights. The Sol-H3-Spark reference pins a DIFFERENT H3 revision for its own stage 1, 9bfb6693f2cf6de171db46d1aa586f67d773a1da, which the recon calls out as a precondition for any weight-level work (docs/minimax-h3/sol-h3-spark-recon-2026-10-28.md:94-96). No weight-level work is in this line."
  upstream_model: MiniMaxAI/MiniMax-H3, the official released BF16 checkpoint
  reference: "NVIDIA NVlabs/Sana, branch sol-engine, commit 6e4a440, read as a blobless sparse checkout (docs/minimax-h3/sol-h3-spark-recon-2026-10-28.md:3-6). It is read-only and is never built or modified. Its Sol-Attn kernels are Python/Triton/CuTe; only the algorithm is ported, and only the two entry points above exist in this engine."
  license: "MiniMax-H3 Community License, unchanged from recipes/minimax-h3.yaml. The reference's own weights are a separate licensing question: its LTX-2.5 transformer and LoRA are gated, its LBH upscaler declares no explicit license, and the FastH3 VSA DataFree LoRA inherits the H3 community licence (docs/minimax-h3/sol-h3-spark-recon-2026-10-28.md:92-97). None of them is fetched or used here."
  recipe_file: "the wire is unchanged: the H3 host still serves the three-route local v1 contract exactly as docs/minimax-h3/local-v1-contract.md reproduces it. The only attention control that reaches the wire is the create body's optional attention field, tensor or scalar (local-v1-contract.md:73, :154), and neither value selects a sparse path."

solo_only: true
cluster_only: false
min_nodes: 1
max_nodes: 1

# This recipe does not move a byte. It reuses the same checkpoint directory, on
# the same volume, read the same way: the components are loaded per render, so
# the whole 288 GB directory is a read-while-serving payload and the disk
# decides a first render's cost, exactly as recipes/minimax-h3.yaml records. No
# sparse or VAE arm changes the checkpoint, the layout or the read path.
defaults:
  # The shared launcher's defaults, restated so this contract stands alone.
  # NOTHING in this recipe changes any of them: there is no sparse default to
  # set, because there is no switch.
  port: 8090
  host: 0.0.0.0
  bind: 0.0.0.0:8090
  steps: 20                 # the reference's own default (h3.h:13-17)
  reuse: 1                  # the reference's own default
  max_jobs: 8
  timeout_secs: 3600        # external-renderer only; the engine path has no per-job timeout
  model_dir: /mnt/h3-artifacts/MiniMax-H3
  out_dir: $HOME/h3-videos
  state_dir: $HOME/h3-server
  guard: 0
  start_floor_mb: 60000     # the API gate's minimum MemAvailable was 67.066 GiB
  short_edge: 768           # the only tier the checkpoint has

shapes:
  checkpoint_bytes_on_the_reference_box: 288102365238
  engine_required_bytes: 210331771721
  engine_required_files: 102
  canvas:
    "16:9": 1344x768
    "9:16": 768x1344
    "4:3": 1024x768
    "3:4": 768x1024
    "1:1": 768x768
  frames_grid: "5+17n, as in recipes/minimax-h3.yaml."
  tokens: "768P 1:1 at 4 s (768x768, 107 frames) is 18,432 tokens; 512x512 with 107 frames is 4,352. These are the two shapes every Sol-Attn number below was measured at, and the first is the one the campaign's yardstick job A actually runs (docs/minimax-h3/speed-2026-10-27.md:44-49, :208-213)."
  attention_shapes:
    "18432x56x128":
      blocks: 288
      mask_words_per_query_block: 9
      is: "the denoise shape: job A at 768x768, 107 frames, and the shape this engine's own bench calls 'the denoise shape' (docs/minimax-h3/sol-forward-2026-10-28.md:82-84)."
    "4352x56x128":
      blocks: 68
      is: "the 512x512 denoise (docs/minimax-h3/sol-forward-2026-10-28.md:96)."
    heads: 56
    head_dim: 128
    blocks_per_group: 32
    h3_dit_blocks: 50          # crates/ds4-core/src/minimax_h3/dit.rs:102, the reference's h3_dit.c:15-30

launch: |
  # The launcher is the shared one. There is no --sol, no --sparse, no
  # --attention sparse, and no environment variable that turns this path on,
  # so a new launcher would change nothing but its own name:
  #   bash scripts/start-minimax-h3.sh start --daemon
  # runs exactly:
  #   setsid nohup $HOME/ds4-dfm-rs/h3-server-rs \
  #       --bind 0.0.0.0:8090 --out-dir $HOME/h3-videos \
  #       --model-dir /mnt/h3-artifacts/MiniMax-H3 \
  #       --steps 20 --reuse 1 --max-jobs 8 --timeout-secs 3600
  # The host's whole flag surface is --bind, --out-dir, --model-dir, --steps,
  # --reuse, --renderer, --renderer-arg, --max-jobs, --timeout-secs, and the
  # sparse entry points are not on it.
  #
  # The acceleration line is exercised at the test/bench layer instead, on the
  # engine tree, with the feature branch checked out and built:
  #   cd $HOME/ds4-dfm-rs
  #   rm -f native/h3/*.o
  #   make tests/h3/sol_forward_bm     # dense vs sparse forward, with controls
  #   make tests/h3/sol_route_bm       # the search step, per kernel
  #   make tests/h3/native_test        # the correctness gates vs the CPU oracle
  # so the sparse path is proven by its own gate and priced by its own bench,
  # not by a serving flag that does not exist.

artifacts:
  checkpoint:
    repository: "MiniMaxAI/MiniMax-H3"
    revision: 42ed227ee7df40d41602854ae760620d6eb651fe
    on_the_reference_box: "/mnt/h3-artifacts/MiniMax-H3, 288,102,365,238 bytes, unchanged from recipes/minimax-h3.yaml."
    required_by_the_engine: "102 unique files, 210,331,771,721 bytes (recipes/minimax-h3.yaml records the composition). This path reads the same set."
  reference_checkout:
    repository: "NVlabs/Sana"
    branch: sol-engine
    commit: 6e4a440
    read_only: true
    note: "read for the algorithm, never built and never modified (docs/minimax-h3/sol-h3-spark-recon-2026-10-28.md:3-6). Its Sol-Attn code is Python/Triton/CuTe, and its runtime needs three separate Python environments plus FA4, ComfyUI and gated weights; none of that is used here and none of it is installed."
  reference_artifact_manifest:
    note: "the reference's own configs/checkpoints.json, quoted from docs/minimax-h3/sol-port-plan-2026-10-28.md:176-181 for scale only. NONE of these weights is fetched or present on this box, and none is needed by the ported code, which is code-only."
    vsa_lora_fast_h3_datafree_bytes: 5339117712
    ltx_transformer_bytes: 42018190584          # gated
    ltx_refiner_lora_bytes: 8899889568          # gated
    qwen_checkpoint_bytes: 15687142551          # NVFP4-AWQ
    h3_upscaler_checkpoint: "no explicit license declared at the pinned revision"
  engine_source:
    file: native/h3/h3_dit_gpu.cu
    entry_points: [h3d_sol_search, h3d_sol_forward]
    note: "declared in native/h3/h3_dit_gpu.h:474-478 (search) and :507-511 (forward), with the routing plan struct at :65-74 and the fixed shapes BLOCK 64, HEAD_DIM 128, GROUP 32 at :45. The DiT still calls h3d_sdpa; the sparse pair is called only by tests/h3/sol_route_bm.cu, tests/h3/sol_forward_bm.cu and tests/h3/test_native.cu."

