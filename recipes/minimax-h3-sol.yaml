disk:
  checkpoint_bytes: 288102365238
  free_needed_bytes: 210331771721
  note: "unchanged by this path. The reference pipeline would additionally need the manifest above (about 72 GB of extra weights, some gated), which is exactly why this line is a port and not a pipeline."

budget:
  measured: false
  measured_note: "No memory reading exists for this path: nothing calls it in production, so no render and no residency figure is attached to it. The host's own measured gate is recipes/minimax-h3.yaml's (minimum MemAvailable 67.066 GiB on the API gate), and none of it is a sparse-path reading."

benchmark:
  measured_here: false
  measured_note: "No clip has been rendered through this path anywhere, and no end-to-end number belongs to it. The figures below are KERNEL-LEVEL micro-benchmarks, timed on the Spark by the engine's own bench binaries (tests/h3/sol_route_bm, tests/h3/sol_forward_bm), on synthetic fixtures. Read them as kernel measurements, not as a render speedup. Every one is taken from docs/minimax-h3/sol-search-step-2026-10-28.md and docs/minimax-h3/sol-forward-2026-10-28.md, which is where the workload, the controls and the clock caveat live."
  measured_on: "DGX Spark gx10-e1d2, sm_121a, CUDA 13.0.88, driver 580.178.04, busy clocks 2.4-2.5 GHz. The host has no nvidia-clocks.service, so the campaign's 300-2200 MHz policy is NOT applied and these absolute figures are taken above the campaign's 2184-2190 MHz reference range (docs/minimax-h3/sol-search-step-2026-10-28.md:256-280). ncu is blocked by ERR_NVGPUCTRPERM, so every attribution is a timing inference, not a counter."
  sol_search_step:
    shape_18432x56x128_ms: {pool: 2.493, statistics: 0.008, threshold: 1.323, route: 0.852, search_total: 4.924, dense_attention_same_shape: 173.163}
    shape_4352x56x128_ms: {pool: 0.592, statistics: 0.004, threshold: 0.323, route: 0.126, search_total: 1.158, dense_attention_same_shape: 9.935}
    search_share_of_dense: "2.8 percent at 18,432 tokens, 11.7 percent at 4,352 (docs/minimax-h3/sol-search-step-2026-10-28.md:136-149)."
    note: "the search step is streaming-bound; its floor is the 792.7 MB of K, V and Q it reads once."
  sol_sparse_forward_shape_18432:
    dense_h3d_sdpa_ms: "173.0-174.3"
    tau_0_5: {exact_share: 0.491, forward_ms: 76.0, forward_plus_search_ms: 80.9, vs_dense: "2.14x"}
    tau_1_25: {exact_share: 0.472, forward_ms: 73.4, forward_plus_search_ms: 78.3, vs_dense: "2.22x"}
    tau_3_0: {exact_share: 0.426, forward_ms: 67.6, forward_plus_search_ms: 72.5, vs_dense: "2.40x"}
    control_all_exact: {exact_share: 1.0, forward_ms: "150.3-152.1", vs_dense: "0.87x", is: "the honest no-gain lower bound: the same walk doing the dense kernel's own work, at 100 percent exact, is 0.87x dense."}
    control_contiguous_window: {exact_share: 0.472, forward_ms: 72.1}
  sol_sparse_forward_shape_4352:
    dense_h3d_sdpa_ms: "9.85-10.00"
    tau_1_25: {exact_share: 0.485, forward_ms: 4.46, forward_plus_search_ms: 5.57, vs_dense: "1.77x, of which 1.10 ms is the routing pass against a 4.46 ms forward"}
    control_all_exact: {exact_share: 1.0, forward_ms: 8.82, vs_dense: "0.88x"}
  correctness:
    gate: "relative RMS < 1e-3 against a CPU oracle that transcribes the reference's own rule, with the mask fed in as an input so the consumer is gated apart from the router."
    measured_relative_rms: "5.3e-05 to 3.2e-04 across eight cases"
    worst_element_delta: "7.812e-03, which is one BF16 ULP on values of order 1"
    suite: "tests/h3/native_test 102 PASS / 0 FAIL on the Spark (sm_121a) and on the workstation (sm_89), up from 73 before the forward landed (docs/minimax-h3/sol-forward-2026-10-28.md:45, :49-67)."
  vae_decode_arm:
    status: "measured elsewhere, pending merge: the FRAMES lever below was measured on the paused branch feat/h3-vae-options off 509ac111, not on feat/sol-h3, and is not part of this branch's artifact."
    frames_seconds: "196.873 (default) -> 34.494 (tensor attention + bf16 gemm)"
    source: "docs/minimax-h3/vae-options-2026-10-28.md:175-181"
  job_a_phase_breakdown_tensor_arm:
    note: "the campaign's yardstick, 768x768, 107 frames, 2 evaluations, seed 42, with the tensor DiT attention that is this engine's default. These are the phases the levers above would touch; they are the port's own end-to-end numbers, not this path's (docs/minimax-h3/speed-2026-10-27.md:520-537)."
    text_s: 27.533
    load_s: 7.160
    denoise_2_evals_s: 40.294
    audio_s: 2.577
    frames_video_vae_decode_s: 197.945
    video_mux_s: 0.623
    total_wall_s: 277.019
  reference_hot_end_to_end:
    seconds: 56.17
    is: "NVIDIA's Sol-H3-Spark reference implementation on one Spark: 1344x768, 121 frames, 5 s, 24 FPS, hot end to end (docs/minimax-h3/sol-h3-spark-recon-2026-10-28.md:33-37)."
    not_comparable: "their job is a different canvas, frame count, step count, model set (H3 draft plus an LTX refiner), decoder and weight formats; the port plan says plainly that no quotient of the two walls means anything and computes none (docs/minimax-h3/sol-port-plan-2026-10-28.md:42-48, :50-55). The reference's own README attributes the figure to the project page and adds 'This is not a throughput or cold-start claim', and it cannot be re-derived from the local tree."

client:
  # Unchanged, because the wire is unchanged: a sparse arm would live behind the
  # same three routes.
  open_grok_skill: h3-video
  base_url: http://192.168.1.91:8090
  auth: none
  routes:
    create: "POST /v1/videos, the five fields (task, prompt, conditions, target, seed) plus an optional top-level attention field, tensor or scalar"
    poll: "GET /v1/videos/{id}"
    download: "GET /v1/videos/{id}/content"
  attention_field: "tensor or scalar only; an unknown value is refused as invalid_attention (docs/minimax-h3/local-v1-contract.md:73, :154). There is no sparse value, and this recipe does not invent one."
  note: "the full client contract is recipes/minimax-h3.yaml's; this path adds no route, no field and no refusal."

limits:
  - "NOT WIRED. The sparse entry points have no production caller: crates/ds4-core/src/minimax_h3/dit.rs:2424 still calls h3d_sdpa, and the only callers of h3d_sol_search / h3d_sol_forward are the engine's own bench and test sources. There is no flag, environment variable or API field that selects them. This is the defining limitation of the whole line."
  - "A kernel-level speedup is not an end-to-end speedup. The 2.14x-2.40x figures are one attention call against a dense attention call of the same shape; nothing here has been run through a denoise pass, and the realized exact/approximate share is a property of the benchmark fixture, not of the model's own latents (docs/minimax-h3/sol-forward-2026-10-28.md:154-163)."
  - "The all-exact control arm is 0.87x dense: the same sparse walk, at 100 percent exact, is SLOWER than the dense kernel. The gain comes entirely from the blocks that are folded, so a sparse mask that routes almost everything exact pays a penalty rather than a speedup."
  - "VSA, the reference's own H3-stage sparsity rule (sparsity 0.9, tile 64, prefix exempt), is documented here but its SELECTOR is not implemented in this port: h3d_sol_search routes against the diag threshold only, and no top-k or prefix-exempt selector exists in the tree (docs/minimax-h3/vsa-policy-2026-10-28.md:3-4, :62-67)."
  - "The reference's H3 stage does not run Sol-Attn at all: stage 1 is VSA on cuDNN BSA, and Sol-Attn is stage 2 on the LTX refiner (docs/minimax-h3/sol-port-plan-2026-10-28.md:25-30). Its 3.1x claim is against FA4, not against this engine's dense kernel."
  - "The port materializes a routing mask, which the reference does not (it computes routing inside the kernel). This is a named deviation, and it costs the measured search step."
  - "The VAE-decode lever (FRAMES 196.873 to 34.494 s) was measured on a different, unmerged branch, feat/h3-vae-options, and is not part of this branch's artifact. It is recorded as measured elsewhere and pending merge."
  - "Nothing at the weight level is in this line: no distilled LoRA, no FP8 W8A8, no NVFP4 text encoder. The reference pins a different H3 revision for those (9bfb6693f2cf6de171db46d1aa586f67d773a1da against this engine's 42ed227e)."
  - "The absolute kernel figures are taken without the campaign's 300-2200 MHz clock policy (nvidia-clocks.service does not exist on the host), so they are not directly comparable to speed-2026-10-27.md's."
  - "The reference implementation's own production stack is not portable as-is: three Python environments, patched FastVideo, FA4, ComfyUI and gated weights, and its clean-environment install is not validated by its authors either (docs/minimax-h3/sol-h3-spark-recon-2026-10-28.md:80-97)."

notes:
  - "This is a documentation contract for a ported-but-unwired acceleration line. It exists so the sparse attention, its VSA policy, the VAE lever and each one's honest status are on the record in this repository next to the serving recipe, not to serve anything new."
  - "The rule 19 QA gate has NOT run for this unit. There is no independent QA report for this change set."
  - "The launcher is deliberately the shared scripts/start-minimax-h3.sh: with no switch to flip, a second launcher would be a rename and nothing more. The acceleration arms are entered at the test/bench layer (make tests/h3/sol_forward_bm, tests/h3/sol_route_bm, tests/h3/native_test)."
  - "The engine branch feat/sol-h3 is published on the operator's fork JLFN/ds4-dfm-rs and is absent from upstream Baekpica/ds4-dfm-rs; it is not an ancestor of upstream main. It is not a release line, and no released H3 binary carries the sparse entry points."
  - "recipes/minimax-h3.yaml remains the serving contract: the same host, the same checkpoint, the same three routes. This file changes none of its numbers and none of its defaults."
