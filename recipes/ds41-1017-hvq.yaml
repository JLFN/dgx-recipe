recipe_version: "4"
name: ds41-1017-hvq
description: "Baekpica's hVQ release of DeepSeek-V4.1-Flash-1017 on the DGX Spark: YoungAi's vq8sh14-q4k-mtpnative quantization with the routed experts refit twice, first against each expert's input second moment (iVQ), then with its off-diagonal part fed forward GPTQ-style through the code assignment (hVQ). One 113.56 GB base GGUF assembled from 40 byte-range parts and carrying the three-tower DSpark drafter, one 971 MB vision sidecar, and the two 1017 Engram tables (2 x 101.5 GB) read in rows from the fast device. Served by ds4-dfm-rs at the native 1048576 context on port 8014. This is the first DeepSeek recipe in this repository whose own artifact was measured on a DGX Spark by its author: generated-position KL 0.247 against 0.302 for VQ, same top-1 84.02 percent, and a 2K-64K prefill sweep of 1,291-1,717 tok/s. Nothing of it has been fetched or loaded here."
model: /mnt/models/ds41-1017-hvq/DeepSeek-V4.1-Flash-vq8sh14-q4k-mtpnative.gguf
model_layout: assembled-from-parts
runtime: ds4-cuda
engine_repo: https://github.com/Baekpica/ds4-dfm-rs
engine_version: "main; the serving check ran 502019da159b86c26b0885c59fb8466000d3d863, the speed table main 58738c04257cf630cac42fb57713de2ea103fd8e (PR #147 and #149, the tensor-core VQ prefill)"
build: make cuda-spark
context: 1048576

# The drafter is embedded in the base, so no --mtp path exists; --mtp-mode only
# chooses the mode, and `auto` is the card's default. YoungAi's finding that this
# weight recipe under-weights stop decisions still applies, so the server defaults
# to non-thinking mode; the card's own 24 short seeded thinking requests all closed
# and stopped. The card's kill switches for the newer kernels are not set here.
env: {}
env_documented_only:
  DS4_DS41_VQ_FP8: "0 restores the pre-#147 routed-expert kernel; the card names it as a kill switch, the launcher does not set it"
  DS4_DS41_Q4P: "0 restores the pre-#147 q4_K projection kernel"

