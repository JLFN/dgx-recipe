    - gb10
  runbook: runbooks/ds41-1017-hvq.md
  launcher: scripts/install-ds41-1017-hvq.sh
  source: https://huggingface.co/Baekpica/DeepSeek-V4.1-Flash-1017-hVQ-GGUF
  revision: 0d3cae07ac7d29dfe02c555d0782da5839f631d9
  published: "the repository's weights landed in 73c97d6 on 2026-11-11T03:18:59Z; the pin is the main head of 2026-11-12T14:53:33Z, and the commits between the two edit the card only (the 40 part digests are identical at both revisions, checked here on 2026-11-13)"
  upstream_model: deepseek-ai/DeepSeek-V4.1-Flash-1017 at 1bae0e1088993b9b82de08f59de5be5a34e42170
  lineage: "VQ (YoungAi's codebooks fitted to the weights) -> iVQ (the diagonal of each expert's input second moment weights the fit) -> hVQ (its off-diagonal part, with the error of each 8-weight block fed forward into the blocks after it). Each step patches the previous release's bytes, so the layout, sizes, sidecar and tables are unchanged."
  recipe_author: "YoungAi (github.com/fodelf/YoungAi) at 7fb26cc, MIT, for the vq8sh14-q4k-mtpnative recipe, the DQVL v3 payload format and the converter; Baekpica for the iVQ and hVQ refits, with the tools in the release's tools/ directory"
  license: mit (weights MIT; YoungAi's quantization tools MIT with the GGML notice; ds4-dfm-rs calibration tools MIT)

solo_only: true
cluster_only: false
min_nodes: 1
max_nodes: 1

# The base is read once at load and stays resident, so it belongs on the roomy
# volume; the vision tower and the Engram tables are read while the server runs, so
# they belong on the fastest device. The installer carries both roots: --gguf-dir
# for the base, --dir for everything read at run time.
defaults:
  port: 8014
  host: 0.0.0.0
  context: 1048576
  max_tokens: 32768
  mtp_mode: auto
  mem_budget_mb: 110000
  vision: true
  gguf_dir: /mnt/models/ds41-1017-hvq
  state_dir: $HOME/models/ds41-1017-hvq
  engram_dir: "a verified existing copy if one is found, else <state_dir>/deepseek-engram"
  kv_disk_dir: $HOME/models/ds41-1017-hvq/kv   # on by default; --no-kv-disk turns it off
  kv_disk_space_mb: ""   # unset means the engine's own 4096 (DS4_KVSTORE_DEFAULT_MB)

launch: |
  ./ds4-dfm-rs/ds4-server --cuda \
      -m "$GGUF_DIR/DeepSeek-V4.1-Flash-vq8sh14-q4k-mtpnative.gguf" \
      --engram-dir "$ENGRAM_DIR" \
      --vision-gguf "$STATE_DIR/DeepSeek-V4.1-Flash.vision.gguf" \
      --mtp-mode auto --mem-budget-mb 110000 \
      --host 0.0.0.0 --port 8014

  # The installer runs exactly this line:
  #   bash scripts/install-ds41-1017-hvq.sh start
  # The card's own quick start uses port 8000, which is the V4.1 port deployment
  # here; 8006 through 8013 belong to the other launchers, so this artifact takes
  # 8014. No --zchain: this artifact ships no domain sidecar.
  # Test only: add --no-vision to drop the sidecar and the tower with it.
  # The launcher passes --kv-disk-dir <state_dir>/kv unless --no-kv-disk is
  # given, and --kv-disk-space-mb when asked:
  #   --kv-disk-dir "$STATE_DIR/kv" --kv-disk-space-mb 8192

