specs:
  base_model: "DeepSeek-V4.1-Flash-1017, DeepSeek's October 17 V4.1 Flash update"
  quantization_lineage: "YoungAi's vq8sh14-q4k-mtpnative recipe builds the VQ base; iVQ refits the routed experts against the diagonal of each expert's input second moment; hVQ refits them again with H_t = D^(1/2) ((1-t) I + t R) D^(1/2), t = 1, damping 0, shrink 4096 tokens. Only the 40 tensors blk.{0..39}.ffn_exps_vq.blob differ from the VQ base, and inside them only the index streams and the F16 gain arrays differ from iVQ."
  routed_experts: "40 layers x 384 experts x gate/up/down: every 8 consecutive weights of a row index a per-layer shared E4M3 codebook, with one F16 row-RMS gain per row. Layers 0-13 use K=8192 (13-bit), layers 14-39 K=4096 (12-bit), about 1.6 bits per routed-expert weight."
  calibration: "the iVQ set, rebuilt with the same seed: 3,095 sequences, 3,653,893 tokens, content SHA-256 5c193cbe. Per expert and column it also keeps sum(x x^T / mean(x^2)) and sum(a a^T / mean(a^2)), shrunk toward the layer mean (gate/up) or the identity (down) with a 4096-token pseudo-count, because the rarest expert of a layer saw 4 tokens."
  skeleton_quant: "q4_K for attention, shared experts, the FP8 indexer and compressor projections, the embedding and the output head"
  drafter: "the three DSpark towers are the VQ release's, unchanged, with their own VQ experts at K=4096"
  vision: "DeepSeek-ViT tower, aligner, image delimiters and the 40 per-layer bias_vl router biases, in the same sidecar as VQ"
  unchanged: "norms, routers and router biases, hyper-connection maps, attention sinks, compressor and small projections, and the Engram projections keep shipped precision; the Engram tables are not in the GGUF"
  weight_space_fidelity: "against iVQ, the card reports plain weight error rising 21.5% and the diagonal-weighted error 32.0%, while the directly measured routed output becomes closer in all 40 layers. The two are consistent: hVQ trades weight distance for output distance on purpose. That is the result to read, not the weight cosine."
  tensor_census: "1,000 tensors, the VQ base's inventory; the release states 8,359,513,152 bytes outside the expert blobs compared byte for byte against that base"
  declared_context: 1048576
  runtime_host: "ds4-server (Rust) from ds4-dfm-rs; YoungAi's ds4-server reads the same layout"
  hardware: "NVIDIA DGX Spark / ASUS Ascent GX10 (GB10, SM121, aarch64, 121.6 GiB unified)"
  card_validation:
    loader: "the base has the VQ release's exact tensor inventory and byte layout and passes the ds4-dfm-rs DeepSeek V4.1 loader check: bind slots=1000 bound=1000 required-missing=0"
    t_zero_identity: "at t=0 the converter reproduces iVQ byte for byte on layer 14; synthetic tests cover both bit widths"
    held_out_caveat: "the card says plainly that the same 26-case held-out set chose t, damping and shrink and then measured the build, so it is not an independent second test"

verification:
  what_the_launcher_proves:
    - "each of the 40 parts against the release's SHA256SUMS before it is appended to the base"
    - "the assembled base against d000e791, which is the only thing that separates this release from the four other 1017 packagings at the same file name and size"
    - "the vision sidecar against 3a8b194a, because the older V4.1 sidecar is a different file under the same name and size"
    - "both Engram tables against the 1017 digests, naming the V4.1 digests when it finds those instead"
    - "a verification record keyed on size and mtime for all four, which start refuses to run without"
    - "the engine's commit against 58738c04 for the card's prefill numbers, as a warning rather than a refusal"
  selftest_2026_11_13: "the launcher's selftest passed here on 2026-11-13: 40 part names including part 08, the part sizes adding to the base, the payload arithmetic, 44 manifest entries with every part and all four identity digests matching the live pinned SHA256SUMS, and the record's staleness logic accepting what it wrote and rejecting a changed tree"
  what_is_not_verified_here: "nothing has been fetched, assembled, loaded or requested on the reference Spark. The memory plan, the throughput, the fidelity and the long-generation behaviour of this file are all the author's measurements until the first start here."

limits:
  - "The routed experts are about 1.6 bits per weight. The card's own summary: real-layer fidelity improved against VQ and iVQ, NLL on held-out text slightly worse, no task benchmark run, and sampled generation checked only on 44 seeded requests."
  - "The hyperparameters and the measurements share one 26-case held-out set, by the card's own statement. That is not an independent test, and a different domain mix could move both."
  - "The MTP draft towers are the VQ release's, unchanged, so drafter acceptance is whatever the old towers give on these experts; decode stayed flat across the prefill work for the same reason."
  - "Thinking is off by default for this weight recipe (under-weighted stop decisions, YoungAi's finding). The card's 24 short seeded thinking requests all closed; long thinking segments were not tested."
  - "One ds4 model at a time: the engine takes a single global lock, so this artifact and the other DeepSeek recipes here cannot both be resident."
  - "The custom VQ format needs ds4-dfm-rs or YoungAi's engine; llama.cpp, Ollama and Transformers cannot read it."
  - "No domain sidecar. YoungAi's V4.1 zchain and GR-RB sidecars were solved against a different base and do not fit these weights, so --zchain is never passed."

notes:
  - "Do not share a directory with any other 1017 packaging. The base file name and byte size are identical across VQ, iVQ, hVQ, the UNCENSORED VQ release and YoungAi's packaging; only the assembled digest differs, and mixing parts across releases produces a file that fails that digest after 113 GB of download."
  - "The sidecar and the tables really are interchangeable with the VQ release's, which is the one place reuse is safe: byte-identical files with published digests, proven by verify before serving."
  - "On the reference box the tables are gone (removed after 2026-10-31) and the sidecar survives in $HOME/models/ds41-1017-unc, so the fresh fetch is 316.6 GB: 113.6 GB of parts plus 203 GB of tables. Both volumes have room; the measured free space is in artifacts.on_the_reference_box."
  - "The engine floor is a speed matter, not a serving one: any build with the V4.1 route serves this file, but the card's 1,662 tok/s median needs 58738c04 (PR #147 and #149). The launcher says so in preflight, plan and build, and never refuses over it."
  - "Payload arithmetic, for anyone auditing the numbers: 40 parts (24 x 2,838,915,986 + 16 x 2,838,915,985 = 113,556,639,424) + sidecar 971,066,016 + tables 203,073,077,576 = 317,600,783,016; the revision's 112 files add about 1.5 MB of docs, tools and images."
