  author: "${USER}"
  maintainer: "${USER}"
  created: "2026-11-13"
  updated: "2026-11-13"
  tags:
    - deepseek
    - deepseek-v4.1
    - deepseek-v4.1-flash-1017
    - vq
    - ivq
    - hvq
    - vector-quantization
    - error-feedback
