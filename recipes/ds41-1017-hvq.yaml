      same_top1: { floor: "96.3%", vq: "81.96%", ivq: "81.87%", hvq: "84.02%" }
      top1_is_the_texts_token: { original: "71.72%", vq: "68.95%", ivq: "68.80%", hvq: "69.47%" }
