client:
  open_grok_skill: h3-video
  base_url: http://192.168.1.91:8090
  auth: none (the contract has no authentication; the operand is network reachability)
  integration: "no config.toml entry and no MCP server: the skill is plain shell plus curl, so any agent that can run a command can drive it. The skill's own client script takes --url, which is the only wiring a remote renderer needs."
  routes:
    create: "POST /v1/videos, five fields (task, prompt, conditions, target, seed), answers {\"id\": \"...\"}"
    poll: "GET /v1/videos/{id} -> queued | in_progress | completed | failed, with queue_position while queued"
    download: "GET /v1/videos/{id}/content -> the MP4; HEAD returns the same headers with no body"
  refusals: "invalid_json, unknown_field, invalid_task, invalid_prompt, invalid_target, invalid_seed, invalid_condition, unsupported_condition, invalid_uri, unsupported_uri, unsupported_short_edge, invalid_aspect_ratio, invalid_duration (400); video_not_found, content_not_found, video_not_ready, unknown_url (404); queue_full (429); renderer_disabled, server_busy (503). An unknown field is refused by name, never ignored."
  probe_without_a_render: "GET /v1/videos/<unknown> answers 404 video_not_found without touching the GPU: that is the liveness probe the launcher uses, because the contract has no /health and no /v1/models."
  progress: "A client with the id follows a job two ways. Over HTTP the record carries status (queued | in_progress | completed | failed), queue_position (1 for the job the engine takes next, null while one holds the slot and after a job has run), the resolved target (size, seconds, frames), the seed, created_at, completed_at and any error -- but no percentage and no steps-done counter. Per-step progress exists only in the host's log: the in-process engine writes one line per evaluated denoise step, STEP <n>/<steps> seconds=<this step> total=<denoise so far> (crates/ds4-core/src/minimax_h3/engine.rs:311-322). An external renderer's own output is not relayed."
  resume: "A render runs inside the host process, so it survives the client that started it: a later client that still has the id can poll it and download it, as long as the same host process is alive. The reverse is also true: the job store is in memory only, so a host restart forgets every record while leaving the MP4s in the output directory untouched and un-adopted. There is no list route, so an id that was never seen cannot be discovered."
  checkpoint_free_mode: "The launch accepts --renderer PROGRAM (and repeatable --renderer-arg) exactly as the binary does, and then no checkpoint is opened at all. tools/minimax_h3/standin-renderer.sh in the engine writes a real MP4 with ffmpeg and never touches the model, which is how the contract, the queue and the download were exercised on the reference box at no GPU cost (port 8091, 2026-10-27). It proves the wire, not generation, and the stand-in's own frame count follows its own request rather than the engine's grid."
  note: "the launch reads 0.0.0.0:8090 by default in this repository's launcher, matching the skill's documented remote use; a private run is H3_BIND=127.0.0.1:8090."

limits:
  - "No authentication of any kind: any host that can reach the listener queues renders and spends the GPU for as long as it likes. Bind beyond loopback only on a network you trust."
  - "One render at a time, in arrival order: the engine admits one job and holds the rest in an in-memory queue. A restart forgets every record and leaves the MP4s in place."
  - "There is no small canvas on the wire: short_edge must be 768 and the duration floor is 4 s, so the cheapest request is 1:1 at 768x768 with 107 frames -- 22 minutes at two steps and hours at twenty. A cheaper execution check is the CLI (h3-rs) on the host at 512x512 with --steps 2, which the wire refuses."
  - "steps and reuse are fixed at startup; a request carries only the seed and the target. Changing the denoise budget means restarting the host."
  - "No /health, no /v1/models, no job list, no delete route: --max-jobs caps retained jobs (default 8) and at capacity every create is 429 queue_full until a restart."
  - "Body caps: 64 MiB request body, 64 KiB of headers, Content-Length required, chunked bodies refused, at most 64 concurrent connections, one request per connection (Connection: close on every response)."
  - "A keyframe or reference URI must be a base64 data URI (PNG/JPEG/WebP, at most 16 MiB decoded); paths and http URLs are refused, so the host never reads a caller-named file and never fetches a URL."
  - "Ref2VA needs at least one image or video: audio alone conditions nothing, a video reference needs at least 2 seconds of soundtrack, and all soundtracks share one 15-second budget. Keyframes and references cannot appear in the same request."
  - "There is no H3 GGUF, VQ or FP8 runtime and no Metal path: the host reads BF16 safetensors on CUDA only, and Apple compilation is not qualified."
  - "The weights are under the MiniMax-H3 Community License, not MIT."
  - "The reference box holds the five shared Ref2VA components as real copies: 134 GiB of duplicate payload for no behavioural difference. Linking them the way the release's instructions do would reclaim it."

notes:
  - "The H3 binary inherits nothing from the LLM launchers: no --daemon, no context, no KV tier, no MTP. Its full flag surface is --bind, --out-dir, --model-dir, --steps, --reuse, --renderer, --renderer-arg, --max-jobs, --timeout-secs. If a recipe or a script in this repository offers a daemon option, that option is bash's setsid+nohup, not the binary's."
  - "The engine opens METADATA only at startup: the tokenizer, then nothing. The component loads happen inside the first render, so a port that answers is a wire that is up, not a host that renders quickly. The launcher's readiness probe is deliberately a refusal (404 video_not_found), never a create."
  - "Port 8090 is this artifact's; 8000-8011 belong to the LLM launchers of the other recipes in this repository, and 8098 is used by an unrelated embedding server on the workstation. One GPU job at a time is the standing rule for the box whatever the ports say."
  - "The other launchers in this repository start with a memory watchdog that stops the server under a floor. This one deliberately does not: the render is the peak, the measured worst case is about 54 GiB of 121, and a killer would abort a legitimate hour-long clip. The start floor is a pre-flight check instead, and H3_GUARD=1 hands the engine's own guard the job if the operator wants it."
  - "The launcher's verify is offline: it uses the downloader's own recorded digests, so it neither needs the network nor trusts this repository. --quick compares presence and partition byte totals, which catch truncation but not a flipped bit."
