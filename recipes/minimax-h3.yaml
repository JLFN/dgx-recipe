recipe_version: "4"
name: minimax-h3
description: "MiniMax-H3, MiniMax's diffusion transformer that generates video and its soundtrack together, served as the local v1 video API on one DGX Spark / GB10 by the ds4-dfm-rs H3 host. Two partitions: FL2VA takes a prompt with optional first/last-frame anchors, Ref2VA takes ordered image, video and audio references, and the engine reads them from one checkpoint directory whose required set is 102 unique files and 210,331,771,721 bytes (all of FL2VA, the Ref2VA transformer and its own model index, and the root metadata; the five remaining Ref2VA components are byte-identical to their FL2VA counterparts at this revision, which is why the release's own instructions link them instead of fetching them twice). It is not an autoregressive model: there is no context, no K/V cache, no token stream and no MTP, so none of the LLM launchers in this repository apply and this recipe shares none of their numbers. The port answers exactly three routes -- create, poll, download -- with no health route and no model list, and the smallest request the contract can express is 1:1 at 768x768 with 107 frames, which measured 22m20s at two denoise evaluations and hours at the release's own twenty."
model: /mnt/h3-artifacts/MiniMax-H3
model_layout: partitioned-checkpoint
runtime: ds4-h3-cuda
engine_repo: https://github.com/Baekpica/ds4-dfm-rs
engine_version: "the H3 host, on main since PR #111 merged; the reference box's checkout reads be3727762b9a03c6faa82b40724eb8055fdd7135, where the server source crates/ds4-server/src/bin/h3-server-rs.rs hashes b9eb9036c5566ea151752248b3f2615d73cbf193b9b901bf26b27dc6c154756a (the same bytes the reference clone /data/ds4-dfm-rs holds on feature/minimax-h3) and was last touched by 18d18884 (Bound H3 HTTP connection lifetimes) and 2b93a42a (Remove H3 experiments and personal workflows). The host pipeline is crates/ds4-core/src/minimax_h3/, the kernels native/h3/, and the port follows h3.c at eae5d54e3a0419064b64171dcaebcfd92e9f3f63."
build: make CUDA_ARCH=sm_121 h3-server-rs
context: not_applicable
banks: not_applicable
not_autoregressive: true
api: local-v1-video-contract

env:
  # The host takes flags, not environment: nothing here needs to be exported.
  # The launcher's own variables, for the operator:
  #   H3_MODEL_DIR    /mnt/h3-artifacts/MiniMax-H3
  #   H3_BIND         0.0.0.0:8090
  #   H3_STEPS        20                 (2 is an execution check)
  #   H3_REUSE        1
  #   H3_MAX_JOBS     8
  #   H3_OUT_DIR      $HOME/h3-videos
  #   H3_STATE_DIR    $HOME/h3-server
  #   H3_GUARD        0                  (1 wraps the server in tools/host_memory_guard.py)
  H3_STEPS: "20"

metadata:
  author: "${USER}"
  maintainer: "${USER}"
  created: "2026-10-27"
  updated: "2026-10-27"
  tags:
    - minimax
    - minimax-h3
    - h3
    - diffusion-transformer
    - dit
    - video-generation
    - text-to-video
    - text-to-audio-video
    - image-to-video
    - reference-to-video
    - fl2va
    - ref2va
    - safetensors
    - bf16
    - ds4
    - cuda
    - spark
    - gb10
    - local-v1-api
    - open-grok-skill
  runbook: runbooks/minimax-h3.md
  launcher: scripts/start-minimax-h3.sh
  source: https://huggingface.co/MiniMaxAI/MiniMax-H3
  revision: 42ed227ee7df40d41602854ae760620d6eb651fe
  revision_note: "the repository's current sha, and the revision the checkpoint on the reference box was fetched from: the Hugging Face download cache under the checkpoint root holds .cache/huggingface/trees/42ed227ee7df40d41602854ae760620d6eb651fe.json and every .metadata record names this commit (checked 2026-10-27). The repository is public and not gated (Hub API: private false, gated false; 5,285,319 downloads, 6384 likes; usedStorage 354,942,260,031 bytes for the whole repository including assets, docs, scripts and the alternate top-level transformer_ref/ and vae/ trees this recipe does not take)."
  upstream_model: "MiniMaxAI/MiniMax-H3, the official release itself (there is no conversion and no quantization step: the runtime reads the released BF16 safetensors)"
  license: "MiniMax-H3 Community License (cardData.license_name minimax-h3-community-license-agreement, LICENSE in the release). It is not MIT, unlike this repository's VQ artifact recipes; the licence file travels with the checkpoint."
  recipe_file: "the wire is the official local contract, reproduced by the port in docs/minimax-h3/local-v1-contract.md and exercised by the release's own scripts/readme/*.sh"

solo_only: true
cluster_only: false
min_nodes: 1
max_nodes: 1

# Where the bytes go, and why.
#   The checkpoint is a directory the engine opens by path; nothing in it is
#   copied to the device at open and nothing is streamed from a second tier.
#   The components are loaded per render, so the whole 288 GB directory is read
#   while serving and the disk it sits on decides how long a first render
#   waits. On the reference box it lives on a 938 GB SATA SSD volume
#   (/mnt/h3-artifacts, 269 GB used) while the home partition is the NVMe; the
#   deliberate placement rule of the other recipes -- read-once bytes on the
#   slow roomy volume, run-time reads on the fast one -- does not apply the
#   same way here, because every byte is a run-time read. A second copy of the
#   five shared components, which the release's instructions avoid with
#   symlinks, costs 134 GiB for no change in behaviour.
defaults:
  port: 8090
  host: 0.0.0.0
  bind: 0.0.0.0:8090
  steps: 20                 # the reference's own default (h3.h:13-17)
  reuse: 1                  # the reference's own default
  max_jobs: 8
  timeout_secs: 3600        # external-renderer only; the engine path has no per-job timeout
  model_dir: /mnt/h3-artifacts/MiniMax-H3
  out_dir: $HOME/h3-videos  # never pruned: one MP4 per job until the operator removes it
  state_dir: $HOME/h3-server
  guard: 0                  # 1 wraps the server in the engine's own tools/host_memory_guard.py
  start_floor_mb: 60000     # the API gate's minimum MemAvailable was 67.066 GiB
  short_edge: 768           # the only tier the checkpoint has

shapes:
  checkpoint_bytes_on_the_reference_box: 288102365238    # 144,051,182,625 (FL2VA) + 144,051,182,613 (Ref2VA)
  engine_required_bytes: 210331771721
  engine_required_files: 102
  engine_required_composition: "81 files of FL2VA + 15 files of Ref2VA/transformer + Ref2VA/model_index.json + the five root metadata files (model_index.json, modular_model_index.json, README.md, LICENSE, .gitattributes). 144,051,182,625 + 66,280,524,863 + 707 + 2,936 + 38,406 = 210,331,749,537 of the 210,331,771,721 the engine's own documentation states; the remaining 22,184 bytes are the other three root files."
  fl2va:
    total_bytes: 144051182625
    files: 81
    transformer: 66280524863
    text_encoder: 66726510529
    video_vae: 10415694629
    audio_vae: 605461455
    tokenizer: 11492078
    processor: 11498352
  ref2va_copied_layout:
    total_bytes: 144051182613
    files: 81
    note: "the reference box's layout: real copies of the five shared components rather than links."
  ref2va_linked_layout:
    total_bytes: 66280525570
    note: "what the release's own instructions produce: Ref2VA/transformer (66,280,524,863 B) plus its own model_index.json (707 B)."
  canvas:
    "16:9": 1344x768
    "9:16": 768x1344
    "4:3": 1024x768
    "3:4": 768x1024
    "1:1": 768x768
  frames_grid: "5+17n: the engine aligns the requested seconds to its own grid, so 4 s becomes 107 frames at 24 fps and the file is slightly longer than the request. The record's frames field is the authority."
  tokens: "768P 16:9 at 4 s is 32,256 tokens; cost grows with the token count, so denoise time is a function of canvas and duration, not of duration alone."
  audio: "always 32 kHz stereo; video is H.264 with AAC in MP4."
  hf_cache_files_on_the_reference_box: 166   # .metadata/.lock records for the 81 files of each partition plus the root files

launch: |
  # As the open-grok client sees it (the h3-video skill speaks plain curl):
  #   skills/h3-video/scripts/h3-video.sh --url http://192.168.1.91:8090 "prompt"
  #
  # The launcher runs exactly this line (the H3 binary has no daemon flag):
  #   setsid nohup $HOME/ds4-dfm-rs/h3-server-rs \
  #       --bind 0.0.0.0:8090 --out-dir $HOME/h3-videos \
  #       --model-dir /mnt/h3-artifacts/MiniMax-H3 \
  #       --steps 20 --reuse 1 --max-jobs 8 --timeout-secs 3600
  #
  # Raw, with no script in the way:
  #   cd $HOME/ds4-dfm-rs && make CUDA_ARCH=sm_121 h3-server-rs
  #   ./h3-server-rs --bind 0.0.0.0:8090 --out-dir /srv/h3-videos \
  #       --model-dir /mnt/h3-artifacts/MiniMax-H3 --steps 2 --reuse 1
  #
  # The wire without the checkpoint (the engine's stand-in renderer writes a real
  # MP4 and never touches the model; --renderer replaces --model-dir):
  #   bash scripts/start-minimax-h3.sh \
  #       --renderer $HOME/ds4-dfm-rs/tools/minimax_h3/standin-renderer.sh \
  #       --bind 0.0.0.0:8091 --state-dir $HOME/h3-server-standin start --daemon
  #
  # Authenticated-free by design: the contract has no auth, so a bind beyond
  # loopback lets every host on the network queue renders and spend the GPU.

artifacts:
  repository: "MiniMaxAI/MiniMax-H3"
  revision: 42ed227ee7df40d41602854ae760620d6eb651fe
  published: "created 2026-07-28T10:45:18Z; lastModified 2026-08-13T01:46:29Z"
  public: true
  gated: false
  files_in_repository: "the tree holds far more than the engine reads: assets/ (sixteen mp4 and png figures), docs/ (the prompt-writing guides and a licence QA note), scripts/readme/ (the official local client scripts), plus top-level transformer/, transformer_ref/, text_encoder/, processor/, tokenizer/, audio_vae/, video_vae/ and vae/ trees. The engine reads only FL2VA/**, Ref2VA/transformer/**, Ref2VA/model_index.json and the root metadata."
  required_by_the_engine: "FL2VA/transformer/config.json and FL2VA/tokenizer/tokenizer.json must be regular files; then text_encoder, transformer, video_vae/source and audio_vae are inventoried in that order. Ref2VA is optional and its whole presence test is the regular file Ref2VA/transformer/model.safetensors.index.json -- when it exists the Ref2VA transformer is inventoried too, so a broken optional component fails at open rather than at the first reference request. A reference request then reads every component from Ref2VA, not only its transformer (crates/ds4-core/src/minimax_h3/partition.rs:15-18, :41-46, :146-155)."
  verification: "There is no SHA256SUMS in the release. The digests used by the launcher's verify are the ones the Hugging Face downloader itself recorded, one .cache/huggingface/download/<path>.metadata per fetched file: line 1 the commit, line 2 the object id (the sha256 of the bytes for LFS payloads, the git blob id for the small text files), line 3 the fetch time. They are written at fetch time and cannot be made to agree with a corrupted byte on disk. Files with no fetch record fall back to a byte comparison against their FL2VA twin, and anything with neither is reported as unchecked rather than counted as verified."
  on_the_reference_box:
    state: "fetched on 2026-10-24 into /mnt/h3-artifacts/MiniMax-H3 and re-measured 2026-10-27: 501 files under the root, 144,051,182,625 B of FL2VA and 144,051,182,613 B of Ref2VA, with the five shared components present as REAL COPIES (each partition carries 81 of the downloader's own fetch records) rather than the links the release's instructions create -- 134 GiB of duplicate payload that serves the same bytes. The Hugging Face tree cache and every metadata record name the pinned revision. The engine's optional partition is complete, so ordered references are served."
    caveat: "Nothing has been RENDERED through this launcher: the checkpoint was fetched and read for structure, digest and byte counts, and the host was built and started for a wire check. Every timing below belongs to the maintainer's validation on the same model on a GB10, not to this box."

