    note: "the flag surface this launcher uses: --bind, --out-dir, --model-dir, --steps, --reuse, --renderer, --renderer-arg, --max-jobs, --timeout-secs. There is no daemon, pid-file or service flag in this binary or in ds4-server-rs (grepped on the reference box, 2026-10-27); daemonising is the launcher's job."
  sibling_artifacts: "unrelated to this repository's MiniMax-M3.1-Flash VQ and GLM/DeepSeek VQ recipes: this is a diffusion video model with no GGUF or VQ loader at all, and the engine has no context, KV or MTP code path for it."

disk:
  checkpoint_bytes: 288102365238
  free_needed_bytes: 210331771721      # a fresh fetch with the release's own link layout
  free_needed_bytes_if_copied: 288102365238
  out_dir_note: "the host never prunes its output directory: one MP4 per job, kept until the operator removes it, and completed records live in memory only, so a restart forgets the ids and leaves the files."
  note: "The checkpoint is a read-while-serving payload in full: the components are loaded per render, so the disk decides the first render's cost. Nothing here streams from a second tier and nothing is copied to the device at open."

