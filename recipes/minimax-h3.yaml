  measured: false
  measured_note: "No memory quote has been taken on this box, and the engine's own quote path does not apply: h3-server-rs has no --check-config and no plan print, it opens metadata at startup and loads components inside a render. What follows is the maintainer's validation reading on a GB10, recorded in docs/minimax-h3/validation-2026-10-26.md."
  host_ram_at_the_reference_box: 121 GB
  api_gate_min_memavailable_gib: 67.066
  api_gate_max_psi_full_avg10_percent: 6.29
  cli_20_step_min_memavailable_gib: 79.419
  derived_peak_gib: "about 54 (121 minus 67.066) for the API gate; the launcher's 60,000 MB start floor is that figure plus headroom, and no memory killer is armed by default because the render itself is the peak and a floor-based killer would abort a legitimate long render."
  guard: "the engine ships tools/host_memory_guard.py and its own docs wrap model runs in it; H3_GUARD=1 here does the same with --max-gib 128 --reserve-gib 2 --trip-gib 2 --psi-full-limit 0 --timeout 0."

