recipe_version: "4"
name: youngai-deepseek-v41-flash-1017
description: "YoungAi's corrected DeepSeek-V4.1-Flash-1017 packaging on the DGX Spark: one 113.56 GB base GGUF assembled from 40 parts (the three-tower DSpark drafter is inside the base), one 971 MB vision sidecar, five 1017-specific domain sidecars of about 42 MB each, and the two official 1017 Engram tables (2 x 101.5 GB) read in rows from the fast device. Served by ds4-dfm-rs at the native 1048576 context on port 8008, replacing the older Baekpica packaging of the same checkpoint."
model: /mnt/models/ds41flash-1017/DeepSeek-V4.1-Flash-1017-vq8sh14-q4k-mtpnative.gguf
model_layout: assembled-from-parts
runtime: ds4-cuda
engine_repo: https://github.com/Baekpica/ds4-dfm-rs
engine_version: "main: DeepSeek V4.1 from PR #80, vision from PR #83; read here at c942523"
build: make cuda-spark
context: 1048576

# This family takes its context bound from the GGUF metadata and rejects -c/--ctx.
# The header read from part01 reports deepseek4.context_length = 1048576. There is
# no context knob in the environment either; the launcher never passes one.
#
# The drafter is embedded: the same header reports deepseek4.mtp.tower_count = 3,
# expert_count = 128, block_size = 5, target_layers = [37, 38, 39] and
# markov_rank = 256. --mtp-mode chooses off/auto/on for that embedded drafter; no
# --mtp sidecar path exists for this artifact.
env: {}

metadata:
  author: "${USER}"
  maintainer: "${USER}"
  created: "2026-10-18"
  updated: "2026-10-18"
  tags:
    - deepseek
    - deepseek-v4.1
    - deepseek-v4.1-flash-1017
    - vq
    - vector-quantization
    - q4k
    - moe
    - mtp
    - dspark
    - engram
    - vision
    - 1m-context
    - ds4
    - cuda
    - spark
    - gb10
  runbook: runbooks/youngai-deepseek-v41-flash-1017.md
  launcher: scripts/ds41flash_1017_install.sh
  source: https://huggingface.co/wenzhouwu/YoungAi-DeepSeek-V4.1-Flash-1017
  revision: 993a24e1ea816c6796c2e6c79bc905383baf1829
  upstream_model: deepseek-ai/DeepSeek-V4.1-Flash-1017 at 1bae0e1088993b9b82de08f59de5be5a34e42170
  recipe_author: YoungAi (github.com/fodelf/YoungAi) at 7fb26cc, MIT
  license: mit (weights MIT, quantizer tools MIT with the GGML notice)
  supersedes: ds41-1017-vq (the Baekpica packaging of the same checkpoint)

solo_only: true
cluster_only: false
min_nodes: 1
max_nodes: 1

defaults:
  port: 8008
  host: 0.0.0.0
  context: 1048576
  max_tokens: 32768
  mtp_mode: auto
  mem_budget_mb: 110000
  vision: true
  domain: finance
  base_dir: /mnt/models/ds41flash-1017
  aux_dir: $HOME/models/ds41flash-1017
  engram_dir: $HOME/models/ds41flash-1017/deepseek-engram

# The served line. -c/--ctx is absent on purpose: the engine refuses it for this
# family and takes 1048576 from deepseek4.context_length. The five domain
# sidecars are separate directories; one is mounted at a time through --zchain.
launch: |
  ./ds4-server --cuda \
      -m /mnt/models/ds41flash-1017/DeepSeek-V4.1-Flash-1017-vq8sh14-q4k-mtpnative.gguf \
      --zchain "$HOME/models/ds41flash-1017/model/DeepSeek-V4.1-Flash-1017-vq8sh14-q4k-mtpnative-grrb-vqfin41_vqhalf_a_n8192-engine" \
      --engram-dir "$HOME/models/ds41flash-1017/deepseek-engram" \
      --vision-gguf "$HOME/models/ds41flash-1017/model/DeepSeek-V4.1-Flash-1017.vision.gguf" \
      --mtp-mode auto --mem-budget-mb 110000 \
      --host 0.0.0.0 --port 8008

  # Domains: finance (above), code, law, medicine, science, or none for the bare
  # base. The launcher maps them; the directory names differ only in the suffix:
  #   ...-grrb-code_fit_n15360-engine
  #   ...-grrb-law_fit_n15360-engine
  #   ...-grrb-med_fit_n15360-engine
  #   ...-grrb-sci_fit_n15360-engine

