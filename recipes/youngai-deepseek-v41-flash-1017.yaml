benchmark:
  measured_here: false
  reference_numbers_source: "ds4-dfm-rs 2K-64K sweep, 2026-10-13, V4.1 Flash built with this recipe and YoungAi's code sidecar, one DGX Spark, temperature 0, automatic embedded MTP"
  reference_decode_tok_s: "38.17 median of three run means; 42.6 at the 2K frontier, 39.8 at 64K"
  reference_prefill_tok_s: "1039.65 median; 1222.4 at 16K on a later build (ae40aa1d)"
  reference_short_prompt_decode_tok_s: "54.10 code, 65.85 table (ae40aa1d)"
  note: "Nothing above is a 1017 measurement. Decode is bandwidth-bound and this artifact reads the same bytes per token as V4.1, but drafter acceptance depends on the generated text and can differ."

specs:
  base_model: "DeepSeek-V4.1-Flash-1017, DeepSeek's October 17 V4.1 Flash update"
  upstream_benchmarks_note: "DeepSeek's own scores describe the FP8 checkpoints, not this quantization: Terminal-Bench 4.0 31.2 -> 42.3, ProgramBench 20.3 -> 29.1, Apex Bench v1.1 64.6 -> 72.1, HLE w/o tools 36.8 -> 42.6, Automation-Bench v1.0.6 54.8 -> 60.5, DeepSWE v1.1 74.2 -> 77.0"
  routed_experts: "8-dim VQ, one E4M3 codebook per layer shared by all 384 experts and gate/up/down, F16 row gains; layers 0-13 use 13-bit indices (K=8192), layers 14-39 use 12-bit (K=4096); no calibration data"
  skeleton_quant: "q4_K for attention, shared experts, the FP8 indexer and compressor projections, the embedding and the output head"
  drafter: "three DSpark towers inside the base, VQ at K=4096 with one shared codebook per tower; other tower weights in native precision"
  vision: "DeepSeek-ViT tower, aligner and per-layer bias_vl router biases from 1017, BF16 matrices, separate sidecar"
  unchanged: "norms, routers and router biases, hyper-connection maps, attention sinks, compressor and small projections, Engram projections"
  weight_space_fidelity: "YoungAi reports mean cosine 0.9253 (layers 0-13) and 0.9107 (14-39) for the routed experts; that is weight reconstruction, not model quality"

verification:
  checked_2026_10_18:
    - "HF API at revision 993a24e1: 395 files, 114,736,871,011 bytes; base 113,556,639,424 B in 40 parts; vision 971,066,016 B; five sidecar directories totalling 209,154,581 B"
    - "SHA256SUMS is 5,358 B and lists the assembled base plus the 40 parts only"
    - "the published vision digest equals the older packaging's 3a8b194a..., so the files are identical"
    - "the base's first 16 MB, fetched by range from part01 and parsed with ds41_inspect at c942523: 73 KV, 1000 tensors, data_pos 4,787,744, alignment 32; general.name 'DeepSeek V4.1 Flash'; context 1,048,576; 3 MTP towers with targets [37,38,39]; Engram layers [1,14]; table names model-00047/48-of-00048.safetensors"
    - "all five sidecar aggregates recomputed from the downloaded directories match the values in this contract; the finance directory was downloaded in full (73 files, 41,834,930 B)"
    - "the engine checkout at c942523 advertises --zchain, --engram-dir, --vision-gguf, --mem-budget-mb and --mtp-mode"
    - "all 48 official 1017 shards were compared with V4.1's through the HF API: every digest differs, while model-00047/48 keep the same names and sizes (V4.1 hashes to 824db488... and 976330f4...)"
  not_checked:
    - "the assembled base digest 0da4ae2d... was not reproduced here: it would require the full 113.6 GB"
    - "the two Engram digests were read from the official repository's LFS metadata, not recomputed from downloaded tables"
    - "nothing was loaded, requested or measured on the Spark for this artifact"

limits:
  - "Lossy at roughly 1.6 bits per routed-expert weight. On V4.1 Flash the recipe agreed with the original's next token 69-79 percent of the time depending on domain (code 78.61, English 78.52, medicine 69.08); 1017 fidelity has not been measured."
  - "No 1017-specific quality or GB10 speed measurement exists, here or upstream. Every speed number in this recipe is the V4.1 reference's."
  - "The Engram tables are not interchangeable between V4.1 and 1017; the names and sizes are identical, so only the SHA-256 separates them."
  - "The five sidecars are not cryptographically bound to the base. The engine checks a base.fnv only for the posttrain directory, not for --zchain; the manifest's base file name is the provenance and the launcher's directory aggregate is the integrity check."
  - "The base's internal general.name is 'DeepSeek V4.1 Flash'; it does not carry 1017. Never identify the artifact by that string."
  - "Long thinking can fail to close on this recipe (under-weighted stop decisions), so the server defaults to non-thinking mode."
  - "One ds4 model at a time: the engine takes a single global lock."

notes:
  - "This replaces the older Baekpica packaging on port 8008. The two bases have the same 113,556,639,424-byte size and different digests (9f3afe6a... against 0da4ae2d...), so they are different files and must not be mixed."
  - "The repository ships no Engram tables; the launcher fetches the two official shards from deepseek-ai/DeepSeek-V4.1-Flash-1017 explicitly."
  - "The base is read once at load and then resident; the sidecars, vision tower and Engram tables are read while the server runs and belong on the fast device."
  - "The launcher appends one part at a time and deletes it as it lands, so assembly needs one extra part (2.8 GB), not another 114 GB."
  - "--min-p is accepted for parity with the older V4.1 installer and is exported as DS4_SERVER_DEFAULT_MIN_P. On the engine build on the box (416d4f5a) that variable feeds the GLM family; the V4.1 route's request-omitted min_p is 0.0 from the engine defaults, so the value does not change this model's sampling."
  - "Ports 8000, 8003, 8005, 8006, 8007 and 8009 answer for the other launchers on this box; 8008 is this one."
