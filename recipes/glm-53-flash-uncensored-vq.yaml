specs:
  artifact: "GLM-5.3-Flash Uncensored VQ GGUF, Q4_K nonexpert v3"
  source_model: "orcarouter/GLM-5.3-Flash-Uncensored-FP8 at 150bd5e3a957db747db1224cc4f8891bcfa7a7f0, the abliterated build of zai-org/GLM-5.3-Flash in the official block-FP8 layout"
  conversion: "the GVQ1 converter used for the base VQ release, changed only in its source path and revision, trained and encoded the 42 routed-expert layers on an H100 and copied the other 3,532 tensors byte for byte into the native, MTP and vision parts"
  routed_experts: "layers 3-44, 36,288 matrices, eight-dimensional VQ at K=8192 with 12+1-bit indices, one E4M3 codebook per layer (all 42 trained fresh, because abliteration rewrote every routed down_proj) and F16 row gains, 1.625 index bits per weight, recipe GLM-R1-uniform8192-native"
  nonexpert_q4k: "316 matrices, 256-element / 144-byte blocks, no importance matrix: KDA q/k/v/o (136), DSA q_a/q_b/kv_a/o (44), dense FFN of layers 0-2 (9), shared experts of layers 3-44 (126) and the output head (1)"
  kept_in_source_precision: "embedding, DSA kv_b (BF16 latent attention), router and its bias, mHC maps, KDA gates, indexer, norms, vision and the MTP layer 45; their bytes equal the source safetensors bytes"
  tensors: 39862
  declared_context: 1048576
  engine_shape_context: "rope_orig_ctx 1_048_576 (crates/ds4-core/src/shape.rs, SHAPE_GLM53_FLASH)"
  runtime_host: "ds4-server (Rust) from ds4-dfm-rs; ds4, ds4-bench and ds4-agent are the same tree"
  hardware: "NVIDIA DGX Spark / ASUS Ascent GX10 (GB10, SM121, aarch64, 121.6 GiB unified)"
  card_validation:
    host_validation: "ds4-dfm-rs dump_validate (the --validate path) returns ok for the release directory at 7ef77272: every part hash, GVQ1 header, codebook, FP8-scale link, Q4_K role and the full tensor layout check out, and the source tokenizer and chat template load"
    routed_expert_mse: "0.143756-0.144532 relative MSE per layer, full matrix; the official base conversion measures 0.143720-0.144518"
    q4k_mse: "0.00516 relative MSE on average over the 316 matrices (0.00502-0.00814; the largest is a shared-expert down_proj)"
    note: "weight-reconstruction errors, not model-quality scores"

limits:
  - "Abliterated: the source model had its safety alignment substantially removed. It can comply with requests the original refuses. The card says it is meant for refusal-mechanism research, red-teaming and robustness evaluation, and that any deployment needs its own safety and moderation layers. This recipe is operational only and takes no position on use."
  - "No speed and no quality figure exists for this artifact, here or upstream. The load, the engine's plan line and the marker check are measured on the reference box; no request has been timed, so every throughput number in this recipe belongs to the base release and is labelled so."
  - "The card's own measurements are weight-reconstruction error, not model-quality scores: routed experts 0.143756-0.144532 relative MSE per layer and Q4_K 0.00516 on average over the 316 matrices. Lossy by construction at roughly 1.6 bits per routed-expert weight. The base release's quality notes apply in kind and were not re-measured here: held-out prose perplexity 4.8555 to 8.0797, code-completion 10.5 to 18.4 percent, Korean meeting-summary degeneration under greedy decoding."
  - "Indistinguishable from the base VQ release inside the runtime: the same 56 part names, the same engine shape name (GLM-5.3-Flash-VQ), the same declared types and sizes. Separate directories and the installer's markers are the only guard."
  - "The vision tower ships in the release (GLM-5.3-Flash-vision-01-of-01.gguf, 1,127,280,128 bytes) but this recipe does not load it, so images are not served. The base release's recipe makes the same choice."
  - "Every reply opens a thinking channel first, so a small max_tokens returns empty content and the text in reasoning_content. On the base release, an omitted effort resolved to max and ran to the completion cap on a bare prompt; the bounded completion is the practical guard."
  - "One ds4 model at a time: the engine takes a single global lock, and this artifact and the base release cannot both be resident on a 121.6 GiB box."
  - "Engine minimum for reading this weight format is c5384b5e (PR #86). The installer checks that the binary advertises --mtp-mode and that the source checkout knows that commit."

notes:
  - "The first start's own lines, on the reference Spark, 2026-10-17: requested reuse=auto max_seqs=auto mtp=on ctx=1048576 floor=4G disk=false, effective reuse=exact max_seqs=2 mtp=on weights=true ctx=1048576 floor=4G disk=false, qualified reuse=unverified disk=none mtp=unverified banks=unverified, with warnings that partial reuse and the MTP execution are present but unqualified. That log also prints family: GLM-5.3-Flash-VQ, which is the collision this recipe guards against, visible in the engine's own output."
  - "Nothing here streams from disk by design: --ssd-streaming is off (the plan prints disk=false), and the load stages the whole 71.96 GiB into the device cache in 9.862 s, which is only possible because the payload fits the box's unified memory. SSD streaming exists for artifacts that do not fit, and it requires a single-shard GLM-5.3 CUDA artifact, which this 56-part release is not."
  - "The abliteration changed the routed experts, so all 42 codebooks were trained fresh on these weights; the base release's codebooks were not reused."
  - "The release must stay a directory. -m takes the directory, not a file, and the tables must sit beside the parts."
  - "--mtp-mode on is required if the predictor is wanted: an automatic mode resolves to off for this family and --mtp-draft is then silently discarded."
  - "The predictor is loaded and offered but not committed on this engine build, by the base release's measurement (tok_per_step 1.0 on every request with the state armed). GLM53UNC_MTP_MODE=off stops paying for state the served lane does not use."
  - "The Hub reports two different repository sizes for this artifact: usedStorage 77,333,686,546 and a 77,335,425,590 total across the 75 files of the pinned revision. The base release's usedStorage (92,601,773,476) exceeds its own revision listing (77,335,661,003), so the storage field appears to count more than one revision's files; the 56-part payload sum of 77,272,028,544 is the number the disk check uses."
  - "The engine tree carries a separate document for a different uncensored artifact, Baekpica/GLM-5.3-Flash-Uncensored-Mixed-Quant-GGUF (IQ2_XXS/IQ2_XS/Q2_K, docs/glm53-uncensored.md). Its file set and its numbers do not describe this VQ release."
