specs:
  artifact: "GLM-5.3-Flash Uncensored VQ GGUF, R13+8 (Q4_K nonexpert v3 with an 8-bit residual stage on 19 routed layers)"
  source_model: "orcarouter/GLM-5.3-Flash-Uncensored-FP8 at 150bd5e3a957db747db1224cc4f8891bcfa7a7f0, the abliterated build of zai-org/GLM-5.3-Flash in the official block-FP8 layout"
  conversion: "the same GVQ1 converter as the base VQ release, with the residual stage added: stage 1 unchanged for all 42 routed layers, and an 8-bit stage trained on this model's own residuals for layers 3-16 at the previous revision and for layers 3-16, 17, 22, 27, 41 and 44 at the pin"
  routed_experts_r13: "23 layers (18-21, 23-26, 28-40, 42 and 43), 8-dimensional VQ at K=8192 with 12+1-bit indices, one E4M3 codebook per layer, F16 row gains, 1.625 index bits per weight"
  routed_experts_r13p8: "19 layers (3-16, 17, 22, 27, 41 and 44): stage 1 as above plus one K=256 E4M3 book per layer, one row-major index byte per 8-weight vector (a GVR8 tensor, glm_vq.residuals links each GVQ1 matrix to its residual, and only these parts declare glm_vq.format_version 2), 2.625 bits per weight in total. Stage-1 and stage-2 indices are chosen jointly (16 nearest stage-1 codewords x all 256 stage-2 codewords, best pair, two rounds, beam 16 per recipe.json)."
  residual_stage_recipe: "GLM-R13p8-beam16: k 256, dim 8, 8-bit row-major bytes, E4M3 book, gain from stage 1, 16,384 training vectors per matrix, seed 5353002 + layer*10000 + matrix_ordinal, weighting by the squared row gain, joint rounds 2 with 10 refit iterations each, container_version 2 - the same recipe at both revisions, and recipe.json at the pin is what names the 19 layers"
  nonzero_q4k: "316 matrices, 256-element / 144-byte blocks, no importance matrix: KDA q/k/v/o (136), DSA q_a/q_b/kv_a/o (44), dense FFN of layers 0-2 (9), shared experts of layers 3-44 (126) and the output head (1) - unchanged from the previous revisions"
  kept_in_source_precision: "embedding, DSA kv_b, router and its bias, mHC maps, KDA gates, indexer, norms, vision and the MTP layer 45; their bytes equal the source safetensors bytes at all three revisions"
  layer_selection: "layers 3-16 were chosen end to end on the base model, one layer at a time against all others R13, by held-out KL reduction (2,575 positions): 5 (0.066), 8 (0.064), 6 (0.064), 14 (0.056), 3 (0.045), then 11, 9, 15, 10, 16, 7, 4, 12, 13 (0.022-0.033), so layers 3-16 take the first 14 places. The pin adds the next five by the same sweep: 17 (0.021), 41 (0.017), 44 (0.015), 27 (0.013) and 22 (0.011), which brings the 19 upgraded layers to 77 percent of the summed single-layer gains. The Uncensored release uses the same layers as the base release."
  card_held_out: "the Uncensored card's own held-out table (5,435 tokens, original-precision non-experts): no upgrade PPL 4.858 / KL 0.607; layers 3-16 PPL 3.987 / KL 0.354; layers 3-16 with joint stages PPL 3.969 / KL 0.342; all 42 layers PPL 3.595 / KL 0.151; original 3.538 / 0"
  card_held_out_on_these_parts: "the card's second table, run on this revision's own parts (5,195 held-out and fixture tokens): layers 3-16 PPL 3.927 / KL 0.331 / top-1 80.6 percent; layers 3-16, 17, 22, 27, 41 and 44 PPL 3.780 / KL 0.282 / top-1 82.0 percent; original 3.500 / 0 / 100 percent. The card notes KL falls on 11 of the 12 held-out cases and that the all-R13 revision was not measured on this model."
  tensors: 56297                        # the pin's own commit message, against 39,862 at the 14-layer revision
  declared_context: 1048576
  engine_shape_context: "rope_orig_ctx 1_048_576 (crates/ds4-core/src/shape.rs, SHAPE_GLM53_FLASH)"
  runtime_host: "ds4-server (Rust) from ds4-dfm-rs; ds4, ds4-bench and ds4-agent are the same tree"
  hardware: "NVIDIA DGX Spark / ASUS Ascent GX10 (GB10, SM121, aarch64, 121.6 GiB unified)"
  card_validation:
    host_validation: "the card states the release loads with a ds4-dfm-rs build carrying GVQ1 container v2 support, that this has been on main since PR #96 (merge 34c46d18), that the runtime binds the residual stage on any routed layer, and that older builds reject the upgraded parts; for the Uncensored artifact the same converter and engine path are used at every revision"
    routed_expert_mse: "the pin's 19 upgraded layers: 0.1438 at R13 to 0.0408 with the residual stage (layer 44: 0.1445 to 0.0414; relative MSE, per the card); the other 23 layers keep the R13 figure, 0.143720-0.144518 for the official conversion"
    q4k_mse: "0.00516 relative MSE on average over the 316 matrices (0.00502-0.00814; the largest is a shared-expert down_proj), unchanged from the previous revision"
    note: "weight-reconstruction errors, not model-quality scores"

limits:
  - "Abliterated: the source model had its safety alignment substantially removed. It can comply with requests the original refuses. The card says it is meant for refusal-mechanism research, red-teaming and robustness evaluation, and that any deployment needs its own safety and moderation layers. This recipe is operational only and takes no position on use."
  - "This revision needs a build at or after PR #96 (34c46d1): the 19 upgraded parts are GVQ1 container v2 and an older build fails them as 'unsupported tensor type'. The all-R13 revision's floor (PR #86, c5384b5e) is not enough."
  - "One 1M bank, not two, and the margin is thin: the card's quote for the 14-layer revision is 112.0 GiB of the 118.7 GiB the engine sees on GB10 and this revision adds 4.2 GiB of weights, so about 116.2 GiB and about 2.5 GiB of headroom. Both the figure and the headroom are the card's arithmetic, not a reading taken on this box. The all-R13 revision fitted two banks at the same context."
  - "Nothing has been timed or quality-evaluated for this artifact at any revision. Every throughput figure in this contract belongs to the base release at the 14-layer revision and was measured by the artifact author; the card's own quality tables cover this revision's parts but were not produced on the ds4 engine."
  - "The two release markers cannot tell the three REVISIONS apart, and no revision can be seen from inside the engine. A directory that holds some of one revision and some of another still passes the release check; only the installer's revision fingerprint and the release's own SHA256SUMS catch it. The fingerprint itself is size-based, so a fourth upstream revision rewriting the same 19 layers to the same sizes would read as the pin: verify is what settles content."
  - "The refetch is in place, so the earlier revisions' bytes are gone once it completes. Both stay available upstream, at the tags r13p8-l3-16 and q4k-v3, and either would need a directory of its own to be kept on the box (GLM53R13P8_REVISION plus GLM53R13P8_MODEL_DIR)."
  - "Lossy by construction: 2.625 bits per routed-expert weight on 19 layers and 1.625 on the other 23. The earlier revision's quality notes apply in kind to the untouched layers and were not re-measured: held-out prose perplexity 4.8555 to 8.0797, code-completion 10.5 to 18.4 percent, Korean meeting-summary degeneration under greedy decoding."
  - "The vision tower ships in the release (GLM-5.3-Flash-vision-01-of-01.gguf, 1,127,280,128 bytes) but this recipe does not load it: text only."
  - "One ds4 model at a time: the engine takes a single global lock, and this artifact and its base sibling cannot both be resident on a 121.6 GiB box."
  - "Long-context behaviour at 1,048,576 has not been evaluated for this artifact at any revision."
  - "The predictor is loaded and offered and not committed on the all-R13 revision's build (tok_per_step 1.0 on every request with the state armed). That was not re-run at either R13+8 revision."

notes:
  - "The revision title, from the Hub: 'R13+8 on 19 routed layers: layers 17, 22, 27, 41 and 44 gain the 8-bit residual stage'. The two earlier revisions are kept as tags in the same repository, r13p8-l3-16 and q4k-v3, and the base VQ release carries the same structure at its own revision 71c73e7e, published 27 minutes after this one."
  - "37 of the 56 part digests are identical across all three revisions (verified against each revision's own Hub listing on 2026-10-18). The 19 that moved are exactly the layers the residual stage was added to - 14 of them by cc70aef5, five more by the pin - and nothing else moved."
  - "Nothing here streams from disk by design: --ssd-streaming is off, and SSD streaming is not available to this family at all (it requires a single-shard, non-VQ Glm53 CUDA artifact: crates/ds4-core/src/ssd_quote.rs:139, crates/ds4-core/src/ssd.rs:68)."
  - "The release must stay a directory. -m takes the directory, not a file, and the tables must sit beside the parts."
  - "--mtp-mode on is required if the predictor is wanted: an automatic mode resolves to off for this family and --mtp-draft is then silently discarded."
  - "Either earlier revision remains reproducible with a directory of its own, because the refetch is in place and one directory cannot hold two revisions: GLM53R13P8_REVISION=r13p8-l3-16 (or the commit cc70aef5) and GLM53R13P8_REVISION=q4k-v3 (or 1764dd87), each with GLM53R13P8_MODEL_DIR pointed elsewhere. The installer guards each of the three states by name and refuses the wrong one."
  - "The all-R13 installer (scripts/install-glm53-uncensored-vq.sh) was retired and deleted on 2026-10-18: with three revisions sharing the 56 part names and both markers, its checks could not tell any of them from its own, and the R13+8 installer now covers all three states in place. The retired file is in this repository's git history."
  - "The card's speed and quality figures for the residual stage are the base release's, taken in the same interleaved runs on one GB10 with one binary; the card states plainly that DGX Spark measurements for the Uncensored release follow."
  - "The engine tree carries a separate document for a different uncensored artifact, Baekpica/GLM-5.3-Flash-Uncensored-Mixed-Quant-GGUF (IQ2_XXS/IQ2_XS/Q2_K, docs/glm53-uncensored.md). Its file set and its numbers do not describe this VQ release."
