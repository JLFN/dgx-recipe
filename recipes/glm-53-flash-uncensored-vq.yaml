    note: "Byte-for-byte the Uncensored source revision's template (10,644 bytes), not the official one shipped with the base release. The engine's own render tests treat GLM VQ as a GLM-5.3 template with the same tool markers and parser (crates/ds4-server/src/render.rs:168)."
  GLM-5.3-Flash-MTP-02-of-04.gguf:
    uncensored: { bytes: 1997061632, sha256: 68a41631cabc0b107e04ab2418e186b76e5debea60d95e1811953cf4f1c28c26 }
    base:       { bytes: 1997061504, sha256: 194058b2ae15048b010149539057cdedbaf2ef11da7f7e4adecf96f45ced51af }
    note: "The only GGUF part whose size differs between the two releases, by 128 bytes. Everything else is name- and size-identical, so a copied file is indistinguishable without a hash."
  other_parts: "the remaining 55 GGUF part names are identical between the two releases, with identical sizes at those names."
  engine_identity: "both releases map to the same shape, name GLM-5.3-Flash-VQ (crates/ds4-core/src/shape.rs:1122). Nothing in the runtime can tell them apart."

disk:
  payload_bytes: 77272028544
  free_needed_bytes: 82272028544
  model_dir_default: /mnt/models/GLM-5.3-Flash-Uncensored-VQ-GGUF
  note: "The base release is read once at load and then stays resident, which is why this repo keeps the 72 GiB payloads on the roomy 953 GB volume (/mnt/models) rather than NVMe: the read happens once and the bytes never move again. The base VQ release was moved there on 2026-10-17 for exactly that reason (its engine-side installer records the move). This release has the same read pattern and belongs on the same volume, in a directory of its OWN."

