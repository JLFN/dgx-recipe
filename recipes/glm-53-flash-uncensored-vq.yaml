specs:
  artifact: "GLM-5.3-Flash Uncensored VQ GGUF, R13+8 (Q4_K nonexpert v3 with an 8-bit residual stage on 14 routed layers)"
  source_model: "orcarouter/GLM-5.3-Flash-Uncensored-FP8 at 150bd5e3a957db747db1224cc4f8891bcfa7a7f0, the abliterated build of zai-org/GLM-5.3-Flash in the official block-FP8 layout"
  conversion: "the same GVQ1 converter as the base VQ release, with the residual stage added: stage 1 unchanged for all 42 routed layers, and an 8-bit stage trained on this model's own residuals for layers 3-16"
  routed_experts_r13: "28 layers (17-44), 8-dimensional VQ at K=8192 with 12+1-bit indices, one E4M3 codebook per layer, F16 row gains, 1.625 index bits per weight"
  routed_experts_r13p8: "14 layers (3-16): stage 1 as above plus one K=256 E4M3 book per layer, one row-major index byte per 8-weight vector (a GVR8 tensor, glm_vq.residuals links each GVQ1 matrix to its residual, and only these parts declare glm_vq.format_version 2), 2.625 bits per weight in total. Stage-1 and stage-2 indices are chosen jointly (16 nearest stage-1 codewords x all 256 stage-2 codewords, best pair, two rounds, beam 16 per recipe.json)."
  residual_stage_recipe: "GLM-R13p8-beam16: k 256, dim 8, 8-bit row-major bytes, E4M3 book, gain from stage 1, 16,384 training vectors per matrix, seed 5353002 + layer*10000 + matrix_ordinal, weighting by the squared row gain, joint rounds 2 with 10 refit iterations each, container_version 2"
  nonzero_q4k: "316 matrices, 256-element / 144-byte blocks, no importance matrix: KDA q/k/v/o (136), DSA q_a/q_b/kv_a/o (44), dense FFN of layers 0-2 (9), shared experts of layers 3-44 (126) and the output head (1) - unchanged from the previous revision"
  kept_in_source_precision: "embedding, DSA kv_b, router and its bias, mHC maps, KDA gates, indexer, norms, vision and the MTP layer 45; their bytes equal the source safetensors bytes at both revisions"
  layer_selection: "layers 3-16 were chosen end to end on the base model, one layer at a time against all others R13, by held-out KL reduction (2,575 positions): 5 (0.066), 8 (0.064), 6 (0.064), 14 (0.056), 3 (0.045), then 11, 9, 15, 10, 16, 7, 4, 12, 13 (0.022-0.033), so layers 3-16 take the first 14 places; the Uncensored release uses the same layers"
  card_held_out: "the Uncensored card's own held-out table (5,435 tokens, original-precision non-experts): no upgrade PPL 4.858 / KL 0.607; layers 3-16 PPL 3.987 / KL 0.354; layers 3-16 with joint stages PPL 3.969 / KL 0.342; all 42 layers PPL 3.595 / KL 0.151; original 3.538 / 0"
  tensors: 39862
  declared_context: 1048576
  engine_shape_context: "rope_orig_ctx 1_048_576 (crates/ds4-core/src/shape.rs, SHAPE_GLM53_FLASH)"
  runtime_host: "ds4-server (Rust) from ds4-dfm-rs; ds4, ds4-bench and ds4-agent are the same tree"
  hardware: "NVIDIA DGX Spark / ASUS Ascent GX10 (GB10, SM121, aarch64, 121.6 GiB unified)"
  card_validation:
    host_validation: "the card states the release loads with a ds4-dfm-rs build carrying GVQ1 container v2 support, and that older builds reject the 14 upgraded parts; for the Uncensored artifact the same converter and engine path are used at both revisions"
    routed_expert_mse: "the 14 upgraded layers: 0.1438 at R13 to 0.0408 with the residual stage (relative MSE, per the card); the other 28 layers keep the R13 figure, 0.143720-0.144518 for the official conversion"
    q4k_mse: "0.00516 relative MSE on average over the 316 matrices (0.00502-0.00814; the largest is a shared-expert down_proj), unchanged from the previous revision"
    note: "weight-reconstruction errors, not model-quality scores"

limits:
  - "Abliterated: the source model had its safety alignment substantially removed. It can comply with requests the original refuses. The card says it is meant for refusal-mechanism research, red-teaming and robustness evaluation, and that any deployment needs its own safety and moderation layers. This recipe is operational only and takes no position on use."
  - "This revision needs a build at or after PR #96 (34c46d1): the 14 upgraded parts are GVQ1 container v2 and an older build fails them as 'unsupported tensor type'. The R13 revision's floor (PR #86, c5384b5e) is not enough."
  - "One 1M bank, not two: the card's quote is 112.0 GiB of the 118.7 GiB the engine sees on GB10. The previous revision fitted two banks at the same context."
  - "Nothing has been timed or quality-evaluated for this artifact at either revision. Every throughput figure in this contract belongs to the base release at R13+8 and was measured by the artifact author."
  - "The two release markers cannot tell the two REVISIONS apart, and the revision cannot be seen from inside the engine. A directory that holds some of one revision and some of the other still passes the release check; only the installer's revision fingerprint and the release's own SHA256SUMS catch it."
  - "The refetch is in place, so the R13 bytes are gone once it completes. The previous revision stays available upstream at the tag q4k-v3 and would need a directory of its own to be kept on the box."
  - "Lossy by construction: 2.625 bits per routed-expert weight on 14 layers and 1.625 on the other 28. The previous revision's quality notes apply in kind to the untouched layers and were not re-measured: held-out prose perplexity 4.8555 to 8.0797, code-completion 10.5 to 18.4 percent, Korean meeting-summary degeneration under greedy decoding."
  - "The vision tower ships in the release (GLM-5.3-Flash-vision-01-of-01.gguf, 1,127,280,128 bytes) but this recipe does not load it: text only."
  - "One ds4 model at a time: the engine takes a single global lock, and this artifact and its base sibling cannot both be resident on a 121.6 GiB box."
  - "Long-context behaviour at 1,048,576 has not been evaluated for this artifact at either revision."
  - "The predictor is loaded and offered and not committed on the R13 revision's build (tok_per_step 1.0 on every request with the state armed). That was not re-run at R13+8."

notes:
  - "The revision title, from the Hub: 'R13+8 revision: routed layers 3-16 gain an 8-bit residual stage'. The previous revision (all routed layers R13) is kept at the tag q4k-v3 in the same repository, and the base VQ release moved to its own R13+8 revision (35d3833d) in the same minute."
  - "42 of the 56 part digests are identical between the two revisions (verified against both Hub listings on 2026-10-18); the 14 that moved are exactly layers 03-16, and they moved because the residual stage was added to them."
  - "Nothing here streams from disk by design: --ssd-streaming is off, and SSD streaming is not available to this family at all (it requires a single-shard, non-VQ Glm53 CUDA artifact: crates/ds4-core/src/ssd_quote.rs:139, crates/ds4-core/src/ssd.rs:68)."
  - "The release must stay a directory. -m takes the directory, not a file, and the tables must sit beside the parts."
  - "--mtp-mode on is required if the predictor is wanted: an automatic mode resolves to off for this family and --mtp-draft is then silently discarded."
  - "The R13 revision remains reproducible: GLM53R13P8_REVISION=1764dd87b8ee92dd288d7df15bf62d120ae010d8 with a directory of its own. The R13 installer in this repo must NOT be pointed at an R13+8 directory: its part count and both markers match, so it would report the newer revision as its own."
  - "The card's speed and quality figures for the residual stage are the base release's, taken in the same interleaved runs on one GB10 with one binary; the card states plainly that DGX Spark measurements for the Uncensored release follow."
  - "The engine tree carries a separate document for a different uncensored artifact, Baekpica/GLM-5.3-Flash-Uncensored-Mixed-Quant-GGUF (IQ2_XXS/IQ2_XS/Q2_K, docs/glm53-uncensored.md). Its file set and its numbers do not describe this VQ release."
