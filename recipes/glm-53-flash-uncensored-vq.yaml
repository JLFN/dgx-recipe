recipe_version: "4"
name: glm-53-flash-uncensored-vq
supersedes: glm-53-flash-uncensored-vq-at-cc70aef5
description: "GLM-5.3-Flash Uncensored VQ, R13+8 revision (Q4_K nonexpert v3): the abliterated GLM-5.3-Flash through the same conversion as the base VQ release, as 56 GGUF parts in a GVQ1 release directory served by the ds4-dfm-rs Rust host at the artifact's native 1048576 context. 19 of the 42 routed layers (3-16, plus 17, 22, 27, 41 and 44) add an 8-bit residual stage - GVQ1 container v2, 2.625 bits per weight - while the other 23 stay R13 at 1.625 bits; the 316 Q4_K nonexpert matrices, the native-precision tensors and the embedded MTP predictor are unchanged from the previous revisions. 94,491,712,768 bytes of payload, one 1M bank on the DGX Spark's 121.6 GiB unified memory. Nothing has been loaded and nothing timed on the reference Spark for this revision: every speed figure recorded here belongs to the base release or to an earlier revision and is labelled as such."
model: /mnt/models/GLM-5.3-Flash-Uncensored-VQ-GGUF
# The release is a DIRECTORY, exactly as the previous revisions are, and it lands
# in the SAME directory: the operator chose an in-place refetch, so the upgraded
# parts replace the earlier revision's and the rest are left untouched.
model_layout: release-directory
runtime: ds4-cuda
engine_repo: https://github.com/Baekpica/ds4-dfm-rs
engine_version: "main @ 34c46d1 (PR #96, 'Add the GLM VQ R13+8 residual stage', merged 2026-10-18T13:51:22Z) or later. This is a FORMAT floor rather than a date: the 19 upgraded parts declare glm_vq.format_version 2 and carry GVR8 residual tensors (type 0x47565238), and a build older than PR #96 has no GVR8 reader at all - its glm_vq.rs match falls through to fail(\"unsupported tensor type\") (c942523:crates/ds4-core/src/glm_vq.rs:370). The engine's shape name is still the literal string GLM-5.3-Flash-VQ (crates/ds4-core/src/shape.rs:1122), served as the variant name at crates/ds4-core/src/serving.rs:1485, so the release cannot be identified from inside the engine. The pin's card states the same floor independently: container v2 has been on main since PR #96 (merge 34c46d18) and the runtime binds the residual stage on any routed layer, so no runtime change is needed for the five extra layers."
build: make cuda-spark
context: 1048576
banks: 1

# The family reports mtp_support unqualified, so an automatic MTP mode resolves to
# Off (crates/ds4-core/src/serving.rs:2410) and --mtp-draft alone is discarded.
# --mtp-mode on is what makes the embedded predictor load.
#
# The continuous decode loop reads its own controls instead of the plan: mode 2 is
# verify+accept, depth is the draft count (ds4.c:62014-62031). The C oracle server
# arms mode 2 whenever an MTP source is loaded (ds4_server.c:23970); the Rust host
# does not, so these two variables are set by the installer.
env:
  DS4_CONT_MTP_MODE: "2"
  DS4_CONT_MTP_DEPTH: "2"

metadata:
  author: "${USER}"
  maintainer: "${USER}"
  created: "2026-10-17"
  updated: "2026-10-18"
  tags:
    - glm
    - glm-5.3
    - flash
    - uncensored
    - abliterated
    - refusal-removed
    - vq
    - vector-quantized
    - residual-vq
    - r13p8
    - moe
    - mtp
    - q4k
    - ds4
    - cuda
    - spark
    - gb10
  runbook: runbooks/glm-53-flash-uncensored-vq.md
  launcher: scripts/install-glm53-uncensored-vq-r13p8.sh
  source: https://huggingface.co/Baekpica/GLM-5.3-Flash-Uncensored-VQ-GGUF
  revision: 743a912d805e563340fa9d107e636cc0584145fd
  previous_revision: cc70aef5a5ad370fbd59a69dc0a39522a1ed5c08 (R13+8 on layers 3-16, kept upstream at the tag r13p8-l3-16)
  previous_revision_2: 1764dd87b8ee92dd288d7df15bf62d120ae010d8 (all routed layers R13, kept upstream at the tag q4k-v3)
  upstream_model: orcarouter/GLM-5.3-Flash-Uncensored-FP8 at 150bd5e3a957db747db1224cc4f8891bcfa7a7f0, itself derived from zai-org/GLM-5.3-Flash
  sibling_release: Baekpica/GLM-5.3-Flash-VQ-GGUF, which carries the same structure at its own concurrent revision 71c73e7ef1ec34f18110b487243f81b64757b160 (2026-10-18T16:48:01Z)
  license: "mit (the weights and the abliterated derivative; YoungAi algorithm attribution in LICENSE-YoungAi)"

solo_only: true
cluster_only: false
min_nodes: 1
max_nodes: 1

# One bank, one process. The engine takes a single global lock, so only one ds4
# model runs on the box. The residual stage costs GiB per upgraded layer, and this
# revision upgrades 19 of them (16.0 GiB against R13's all-VQ payload), so at the
# native 1,048,576 context the card's own quote - 112.0 GiB for the 14-layer
# revision - becomes about 116.2 GiB of the 118.7 GiB the engine sees on GB10:
# ONE 1M bank fits where the previous revision fitted two. The base VQ release owns
# port 8007 and this one keeps 8009, the port its earlier revisions answered on.
defaults:
  port: 8009
  host: 0.0.0.0
  context: 1048576
  max_tokens: 393216      # the engine's own reported family cap, read from /v1/models on the R13 revision, 2026-10-17; not re-read since
  banks: 1
  max_seqs: 1
  mtp_mode: "on"
  mtp_draft: 2
  mem_floor_gb: 2         # the installer's post-load floor, lowered from 4 GB for this revision: see budget.reference_quote.headroom_gib

shapes:
  "1m": { context: 1048576, banks: 1, note: "The artifact's native context with ONE bank. The card's quote for the 14-layer revision is 112.0 GiB of 118.7 GiB on GB10 and this revision weighs 4.2 GiB more, so about 116.2 GiB by that quote: two banks do not fit, and the headroom is about 2.5 GiB. No other shape has been tried on a Spark at all." }

launch: |
  # Default (one bank, native 1M context, embedded predictor armed):
  DS4_CONT_MTP_MODE=2 DS4_CONT_MTP_DEPTH=2 \
  ./ds4-server --cuda -m /mnt/models/GLM-5.3-Flash-Uncensored-VQ-GGUF \
    --mtp-mode on --mtp-draft 2 --max-seqs 1 --host 0.0.0.0 --port 8009 \
    --model-id glm-5.3-flash-uncensored-vq --no-update-check

  # The installer runs exactly this line:
  #   bash scripts/install-glm53-uncensored-vq-r13p8.sh start --daemon
  # Shallower, which is where a second bank becomes affordable again:
  #   GLM53R13P8_CTX=65536 GLM53R13P8_MAX_SEQS=2 bash scripts/install-glm53-uncensored-vq-r13p8.sh start
  # Without the predictor, which this engine build does not commit anyway:
  #   GLM53R13P8_MTP_MODE=off bash scripts/install-glm53-uncensored-vq-r13p8.sh start

