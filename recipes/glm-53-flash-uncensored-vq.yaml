  author: "${USER}"
  maintainer: "${USER}"
  created: "2026-10-17"
  updated: "2026-10-18"
  tags:
    - glm
    - glm-5.3
    - flash
    - uncensored
    - abliterated
    - refusal-removed
    - vq
    - vector-quantized
    - residual-vq
