    chat_template.jinja:
      uncensored: { bytes: 10644, sha256: 34d5ee66b12fa6446cdae131c352b8f68cd85369e0e6fda115583805fada3891 }
      base:       { bytes: 10950, sha256: 0c4099f3382d6c92700dfb99725025360966fd73032f0ecf32377c0d9e6309c5 }
      note: "Byte-for-byte the Uncensored source revision's template (10,644 bytes), not the official one shipped with the base release. The engine's own render tests treat GLM VQ as a GLM-5.3 template with the same tool markers and parser (crates/ds4-server/src/render.rs:168)."
    GLM-5.3-Flash-MTP-02-of-04.gguf:
      uncensored: { bytes: 1997061632, sha256: 68a41631cabc0b107e04ab2418e186b76e5debea60d95e1811953cf4f1c28c26 }
      base:       { bytes: 1997061504, sha256: 194058b2ae15048b010149539057cdedbaf2ef11da7f7e4adecf96f45ced51af }
      note: "The only GGUF part whose size differs between the two releases, by 128 bytes - and it is the same 128-byte difference at both revisions."
    other_parts: "the remaining 55 GGUF part names are identical between the two releases, with identical sizes at those names, at both revisions."
  revision:
    GLM-5.3-Flash-VQ-layer-03.gguf: { pin: 2383481600, r13p8_l3_16: 2383481600, r13: 1477184128 }
    GLM-5.3-Flash-VQ-layer-10.gguf: { pin: 2383485056, r13p8_l3_16: 2383485056, r13: 1477184896 }
    GLM-5.3-Flash-VQ-layer-17.gguf: { pin: 2383485056, r13p8_l3_16: 1477184896, r13: 1477184896 }
    groups: "early7 (layers 03-09), middle7 (layers 10-16), late5 (layers 17, 22, 27, 41, 44). The installer counts all three groups and reports the directory as pinned, r13p8-l3-16, r13, mixed, absent or unknown; a mixed directory names the parts that are stale or missing."
    note: "The revision fingerprint, and its stated blind spot: a fourth upstream revision that rewrote the same 19 layers to the same sizes would read as the pin, so verify (the release's own SHA256SUMS) is what settles content. 37 of the 56 part digests are identical across all three revisions, verified against each revision's own Hub listing on 2026-10-18: the 19 rewritten layer parts and nothing else moved. The layer list is the artifact's own - recipe.json at the pin sets residual_stage.layers to 3-16, 17, 22, 27, 41 and 44."
