    - q4k
    - ds4
    - cuda
    - spark
    - gb10
  runbook: runbooks/glm-53-flash-uncensored-vq.md
  launcher: scripts/install-glm53-uncensored-vq-r13p8.sh
  previous_launcher: scripts/install-glm53-uncensored-vq.sh
  source: https://huggingface.co/Baekpica/GLM-5.3-Flash-Uncensored-VQ-GGUF
  revision: cc70aef5a5ad370fbd59a69dc0a39522a1ed5c08
  previous_revision: 1764dd87b8ee92dd288d7df15bf62d120ae010d8, the R13 revision, kept upstream at the tag q4k-v3
  upstream_model: orcarouter/GLM-5.3-Flash-Uncensored-FP8 at 150bd5e3a957db747db1224cc4f8891bcfa7a7f0, itself derived from zai-org/GLM-5.3-Flash
  sibling_release: Baekpica/GLM-5.3-Flash-VQ-GGUF, which moved to its own R13+8 revision 35d3833d5135b14fe55717e2d54071b7cb334347 the same day
  license: "mit (the weights and the abliterated derivative; YoungAi algorithm attribution in LICENSE-YoungAi)"

solo_only: true
cluster_only: false
min_nodes: 1
max_nodes: 1

# One bank, one process. The engine takes a single global lock, so only one ds4
# model runs on the box. R13+8 costs 11.8 GiB more than R13 (14 layers x 0.844
# GiB), and at the native 1,048,576 context the card's own quote is 112.0 GiB of
# the 118.7 GiB the engine sees on GB10: ONE 1M bank fits where the previous
# revision fitted two. The base VQ release owns port 8007 and this one keeps 8009,
# the port its previous revision already answered on.
defaults:
  port: 8009
  host: 0.0.0.0
  context: 1048576
  max_tokens: 393216      # the engine's own reported family cap, read from /v1/models on the R13 revision, 2026-10-17; not re-read at R13+8
  banks: 1
  max_seqs: 1
  mtp_mode: "on"
  mtp_draft: 2
  mem_floor_gb: 4

shapes:
  "1m": { context: 1048576, banks: 1, note: "The artifact's native context with ONE bank. The card's --check-config quote for this revision is 112.0 GiB (weights 83.8, bank 12.8, scratch 10.7, MTP 0.7, floor 4) against 118.7 GiB available on GB10, so two banks do not fit. No other shape has been tried on a Spark at all." }

launch: |
  # Default (one bank, native 1M context, embedded predictor armed):
  DS4_CONT_MTP_MODE=2 DS4_CONT_MTP_DEPTH=2 \
  ./ds4-server --cuda -m /mnt/models/GLM-5.3-Flash-Uncensored-VQ-GGUF \
    --mtp-mode on --mtp-draft 2 --max-seqs 1 --host 0.0.0.0 --port 8009 \
    --model-id glm-5.3-flash-uncensored-vq --no-update-check

  # The installer runs exactly this line:
  #   bash scripts/install-glm53-uncensored-vq-r13p8.sh start --daemon
  # Shallower, which is where a second bank becomes affordable again:
  #   GLM53R13P8_CTX=65536 GLM53R13P8_MAX_SEQS=2 bash scripts/install-glm53-uncensored-vq-r13p8.sh start
  # Without the predictor, which this engine build does not commit anyway:
  #   GLM53R13P8_MTP_MODE=off bash scripts/install-glm53-uncensored-vq-r13p8.sh start

