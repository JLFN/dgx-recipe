recipe_version: "4"
name: glm-53-flash-uncensored-vq
supersedes: glm-53-flash-uncensored-vq-at-1764dd87
description: "GLM-5.3-Flash Uncensored VQ, R13+8 revision (Q4_K nonexpert v3): the abliterated GLM-5.3-Flash through the same conversion as the base VQ release, as 56 GGUF parts in a GVQ1 release directory served by the ds4-dfm-rs Rust host at the artifact's native 1048576 context. 14 of the 42 routed layers (3-16) add an 8-bit residual stage - GVQ1 container v2, 2.625 bits per weight - while the other 28 stay R13 at 1.625 bits; the 316 Q4_K nonexpert matrices, the native-precision tensors and the embedded MTP predictor are unchanged from the previous revision. 89,960,211,968 bytes of payload, one 1M bank on the DGX Spark's 121.6 GiB unified memory. Nothing has been loaded and nothing timed on the reference Spark for this revision: every speed and quality figure recorded here belongs to the base release or to the previous revision and is labelled as such."
model: /mnt/models/GLM-5.3-Flash-Uncensored-VQ-GGUF
# The release is a DIRECTORY, exactly as the previous revision is, and it lands in
# the SAME directory: the operator chose an in-place refetch, so the 14 rewritten
# parts replace the R13 ones and the other 42 are left untouched.
model_layout: release-directory
runtime: ds4-cuda
engine_repo: https://github.com/Baekpica/ds4-dfm-rs
engine_version: "main @ 34c46d1 (PR #96, 'Add the GLM VQ R13+8 residual stage', merged 2026-10-18T13:51:22Z) or later. This is a FORMAT floor rather than a date: the 14 upgraded parts declare glm_vq.format_version 2 and carry GVR8 residual tensors (type 0x47565238), and a build older than PR #96 has no GVR8 reader at all - its glm_vq.rs match falls through to fail(\"unsupported tensor type\") (c942523:crates/ds4-core/src/glm_vq.rs:370). The engine's shape name is still the literal string GLM-5.3-Flash-VQ (crates/ds4-core/src/shape.rs:1122), served as the variant name at crates/ds4-core/src/serving.rs:1485, so the release cannot be identified from inside the engine."
build: make cuda-spark
context: 1048576
banks: 1

# The family reports mtp_support unqualified, so an automatic MTP mode resolves to
# Off (crates/ds4-core/src/serving.rs:2410) and --mtp-draft alone is discarded.
# --mtp-mode on is what makes the embedded predictor load.
#
# The continuous decode loop reads its own controls instead of the plan: mode 2 is
# verify+accept, depth is the draft count (ds4.c:62014-62031). The C oracle server
# arms mode 2 whenever an MTP source is loaded (ds4_server.c:23970); the Rust host
# does not, so these two variables are set by the installer.
env:
  DS4_CONT_MTP_MODE: "2"
  DS4_CONT_MTP_DEPTH: "2"

