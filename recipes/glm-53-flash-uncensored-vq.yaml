    GLM-5.3-Flash-VQ-layer-10.gguf: { r13p8: 2383485056, r13: 1477184896 }
    note: "The revision fingerprint. Layers 03-09 and 10-16 have different sizes at each revision, so the installer counts both halves (7 + 7) and reports the directory as r13p8, r13, mixed or unknown; a mixed directory names the stale parts. 42 of the 56 part digests are identical across the two revisions, verified against both Hub listings on 2026-10-18: the 14 rewritten layer parts and nothing else moved."
    unchanged_across_revisions: "28 R13 layer parts (1,477,184,896 each), 9 native parts, 4 MTP parts, the vision tower, and every one of the two release markers above."
