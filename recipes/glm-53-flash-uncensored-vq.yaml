recipe_version: "4"
name: glm-53-flash-uncensored-vq
description: "GLM-5.3-Flash Uncensored VQ (Q4_K nonexpert v3) on the ds4 CUDA engine: the abliterated GLM-5.3-Flash through the same two recipes as the base VQ release, 56 GGUF parts in a GVQ1 release directory, served by the ds4-dfm-rs Rust host at the artifact's native 1048576 context with two banks. VQ experts in Q4_K, everything else in the original precision, the embedded MTP predictor inside the release. Sized for the DGX Spark's 121.6 GiB unified memory. Nothing in this recipe has been measured on a Spark: the artifact's card records weight-reconstruction error and a host-side validation, not a run."
model: /mnt/models/GLM-5.3-Flash-Uncensored-VQ-GGUF
# The release is a DIRECTORY, exactly as the base VQ release is. The parts sit
# beside the tables that describe them (files.json, tensor-manifest.json,
# tokenizer.json, tokenizer_config.json, chat_template.jinja) and the host reads
# them from the directory it is given.
model_layout: release-directory
runtime: ds4-cuda
engine_repo: https://github.com/Baekpica/ds4-dfm-rs
engine_version: "main @ c5384b5e (PR #86, GLM-5.3-Flash VQ) or later. The artifact card's own host validation (dump_validate, the --validate path) ran at 7ef77272 (PR #89); the base VQ recipe in this repo was measured on the optimize4 checkout. The engine's shape for this weight format is the literal name GLM-5.3-Flash-VQ (crates/ds4-core/src/shape.rs:1122), served as the variant name at crates/ds4-core/src/serving.rs:1485, so the release cannot be identified from inside the engine."
build: make cuda-spark
context: 1048576

# The family reports mtp_support unqualified, so an automatic MTP mode resolves to
# Off (crates/ds4-core/src/serving.rs:2410) and --mtp-draft alone is discarded.
# --mtp-mode on is what makes the embedded predictor load.
#
# The continuous decode loop reads its own controls instead of the plan: mode 2 is
# verify+accept, depth is the draft count (ds4.c:62014-62031). The C oracle server
# arms mode 2 whenever an MTP source is loaded (ds4_server.c:23970); the Rust host
# does not, so these two variables are set by the installer.
env:
  DS4_CONT_MTP_MODE: "2"
  DS4_CONT_MTP_DEPTH: "2"

metadata:
  author: "${USER}"
  maintainer: "${USER}"
  created: "2026-10-17"
  updated: "2026-10-17"
  tags:
    - glm
    - glm-5.3
    - flash
    - uncensored
    - abliterated
    - refusal-removed
    - vq
    - vector-quantized
    - moe
    - mtp
    - q4k
    - ds4
    - cuda
    - spark
    - gb10
  runbook: runbooks/glm-53-flash-uncensored-vq.md
  launcher: scripts/install-glm53-uncensored-vq.sh
  source: https://huggingface.co/Baekpica/GLM-5.3-Flash-Uncensored-VQ-GGUF
  revision: 1764dd87b8ee92dd288d7df15bf62d120ae010d8
  upstream_model: orcarouter/GLM-5.3-Flash-Uncensored-FP8 at 150bd5e3a957db747db1224cc4f8891bcfa7a7f0, itself derived from zai-org/GLM-5.3-Flash
  sibling_release: Baekpica/GLM-5.3-Flash-VQ-GGUF at 4da527cd0f9e83ccd9fb451a1feaf3ba861f7c77
  license: "mit (the weights and the abliterated derivative; YoungAi algorithm attribution in LICENSE-YoungAi)"

solo_only: true
cluster_only: false
min_nodes: 1
max_nodes: 1

# Two banks, one process. The engine takes a single global lock, so only one ds4
# model runs on the box; the two banks are how many conversations that one model
# holds at once, not how many models can run. The base VQ release owns port 8007
# and this one takes 8009, because the two releases are alternatives rather than
# companions: they cannot be resident at the same time.
defaults:
  port: 8009
  host: 0.0.0.0
  context: 1048576
  max_tokens: 32768
  banks: 2
  mtp_mode: "on"
  mtp_draft: 2
  mem_floor_gb: 4

shapes:
  "1m": { context: 1048576, banks: 2, note: "The artifact's native context with the plan's automatic two-bank width. No other shape has been tried, and this one has not been tried on a Spark at all." }

launch: |
  # Default (two banks, native 1M context, embedded predictor armed):
  DS4_CONT_MTP_MODE=2 DS4_CONT_MTP_DEPTH=2 \
  ./ds4-server --cuda -m /mnt/models/GLM-5.3-Flash-Uncensored-VQ-GGUF \
    --mtp-mode on --mtp-draft 2 --host 0.0.0.0 --port 8009 \
    --model-id glm-5.3-flash-uncensored-vq --no-update-check

  # The installer runs exactly this line:
  #   bash scripts/install-glm53-uncensored-vq.sh start --daemon
  # Shallower and single-sequence:
  #   GLM53UNC_CTX=65536 GLM53UNC_MAX_SEQS=1 bash scripts/install-glm53-uncensored-vq.sh start
  # Without the predictor, which this engine build does not commit anyway:
  #   GLM53UNC_MTP_MODE=off bash scripts/install-glm53-uncensored-vq.sh start

