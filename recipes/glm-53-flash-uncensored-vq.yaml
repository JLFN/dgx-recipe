limits:
  - "Abliterated: the source model had its safety alignment substantially removed. It can comply with requests the original refuses. The card says it is meant for refusal-mechanism research, red-teaming and robustness evaluation, and that any deployment needs its own safety and moderation layers. This recipe is operational only and takes no position on use."
  - "No DGX Spark run of this artifact exists, here or upstream: no load, no request, no speed and no quality figure. Everything measured-looking in this recipe is the base release's or the card's weight-reconstruction error."
  - "Lossy by construction, at roughly 1.6 bits per routed-expert weight. The base release's quality notes apply in kind and were not re-measured here: held-out prose perplexity 4.8555 to 8.0797, code-completion 10.5 to 18.4 percent, and Korean meeting-summary degeneration under greedy decoding. The card states this is not a quality-equivalent replacement of the source model."
  - "Indistinguishable from the base VQ release inside the runtime: the same 56 part names, the same engine shape name (GLM-5.3-Flash-VQ), the same declared types and sizes. Separate directories and the installer's markers are the only guard."
  - "The vision tower ships in the release (GLM-5.3-Flash-vision-01-of-01.gguf, 1,127,280,128 bytes) but this recipe does not load it, so images are not served. The base release's recipe makes the same choice."
  - "Every reply opens a thinking channel first, so a small max_tokens returns empty content and the text in reasoning_content. On the base release, an omitted effort resolved to max and ran to the completion cap on a bare prompt; the bounded completion is the practical guard."
  - "One ds4 model at a time: the engine takes a single global lock, and this artifact and the base release cannot both be resident on a 121.6 GiB box."
  - "Engine minimum for reading this weight format is c5384b5e (PR #86). The installer checks that the binary advertises --mtp-mode and that the source checkout knows that commit."

notes:
  - "The abliteration changed the routed experts, so all 42 codebooks were trained fresh on these weights; the base release's codebooks were not reused."
  - "The release must stay a directory. -m takes the directory, not a file, and the tables must sit beside the parts."
  - "--mtp-mode on is required if the predictor is wanted: an automatic mode resolves to off for this family and --mtp-draft is then silently discarded."
  - "The predictor is loaded and offered but not committed on this engine build, by the base release's measurement (tok_per_step 1.0 on every request with the state armed). GLM53UNC_MTP_MODE=off stops paying for state the served lane does not use."
  - "The Hub reports two different repository sizes for this artifact: usedStorage 77,333,686,546 and a 77,335,425,590 total across the 75 files of the pinned revision. The base release's usedStorage (92,601,773,476) exceeds its own revision listing (77,335,661,003), so the storage field appears to count more than one revision's files; the 56-part payload sum of 77,272,028,544 is the number the disk check uses."
  - "The engine tree carries a separate document for a different uncensored artifact, Baekpica/GLM-5.3-Flash-Uncensored-Mixed-Quant-GGUF (IQ2_XXS/IQ2_XS/Q2_K, docs/glm53-uncensored.md). Its file set and its numbers do not describe this VQ release."
