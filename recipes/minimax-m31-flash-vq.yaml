client:
  open_grok_slug: minimax-m31-flash-vq
  base_url: http://192.168.1.91:8011/v1
  api_backend: chat_completions
  context_window: 1048576
  temperature: 1.0
  top_p: 0.95
  supports_images: true
  supports_video: true
  supports_tools: true
  supports_reasoning_effort: true
  max_completion_tokens: not_read
  note: "The card recommends temperature 1.0 and top_p 0.95. Thinking is adaptive on this template: a reply opens with <mm:think>...</mm:think> or a bare </mm:think>, thinking off prefills </mm:think> and renders effort 'low' (there is no 'none'), and a request without an effort renders the port's default 'low'. Tool calls are the template's XML with the ]<]minimax[>[ namespace. max_completion_tokens is deliberately UNSET: the ds4 host reports it per launch in /v1/models as min(its server default, the context), so there is no artifact-level value to record and a guessed one would cap long answers or be rejected; read the field from the running server and set it here and in the config entry. The config entry exists as of 2026-10-26 ([model.\"minimax-m31-flash-vq\"] in ~/.opengrok/config.toml, base_url http://192.168.1.91:8011/v1, api_key dummy) and appears in the model list after an open-grok restart; nothing has answered on that port yet, because the artifact is not on the Spark."

