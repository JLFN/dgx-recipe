recipe_version: "4"
name: minimax-m31-flash-vq
description: "MiniMax-M3.1-Flash, MiniMax's 428B multimodal MoE, through the GVQ1 conversion published as Baekpica/MiniMax-M3.1-Flash-VQ-GGUF: 61 independent GGUF parts, 115,526,325,376 bytes, whose 57 routed-expert parts are 13-bit VQ on every MoE layer with an 8-bit residual stage (R13+8) on the twenty layers an end-to-end measurement picked, served by ds4-dfm-rs on one DGX Spark at the model's own 1,048,576-token context (the operator's choice; --ctx 524288 is the lighter shape and halves what the tiers cost). The routed experts (1.98 bits per weight on average) are the whole point: 111,333,740,672 bytes of trunk, body and drafter stay resident, while the token table is read in rows and the vision tower is mapped on demand, and the K/V of a context past 131,072 tokens lives in an unlinked O_DIRECT file that the model's own MSA indexer addresses block by block. The artifact author measured it on one Spark (905.1 prefill / 19.56 decode tok/s over 2K-64K with the gated DSpark drafter, 10.6 tok/s decode at the exact 1M frontier); nothing here has been loaded on any Spark yet, and the engine is no longer the obstacle: the family merged into main on 2026-10-25, so what is missing is the measurement."
model: /mnt/models/MiniMax-M3.1-Flash-VQ-GGUF
model_layout: release-directory
runtime: ds4-cuda
engine_repo: https://github.com/Baekpica/ds4-dfm-rs
engine_version: "the minimax_m3_vq family, on main since PR #110 ('Add the MiniMax-M3.1-Flash VQ family') merged 2026-10-25T02:33:10Z at head 4988ae7. First read here from refs/remotes/origin/feat/add-minimax-vq fd7192f4 in the reference checkout, which is what the launcher's flags and the lane rule were verified against (main's own copies of serving.rs and ds4-server-rs.rs were read for the lane rule on 2026-10-26); the numbers on the card and in the engine's docs come from ff430197 (the gated DSpark build the 2K-64K sweep ran) and c90530f1 (the benchmark tree). The floor is a FORMAT floor rather than a date: the release's parts declare minimax_m3_vq.format_version 1 or 2 and a source revision the reader compares against 54e4e69dfc452b1e94a426c24a4fdeeaa8e3ad5e, so a build without the family rejects the directory at identify time rather than misreading it (crates/ds4-core/src/minimax_vq/release.rs)."
build: make cuda-spark
context: 1048576
banks: 1

# The tile the launcher sets, and where each piece of this artifact belongs.
# The engine has exactly two run-time-read locations on this family: the release
# directory itself and DS4_KV_OFFLOAD_DIR. Everything else the release names is
# copied to the device once at open.
env:
  DS4_KV_OFFLOAD_DIR: "$HOME/models/minimax-m31-vq/kv-offload"   # the SSD K/V tier (O_TMPFILE, O_DIRECT); default would be ~/.cache/ds4/kv-offload
  # Diagnostic switches, off unless set (docs/minimax-vq.md "Diagnostic switches"):
  #   DS4_MINIMAX_KV_RESIDENT_CTX   largest context whose K/V pages stay resident (default 131072; 0 = SSD tier always)
  #   DS4_MINIMAX_KV_POOL_SLOTS     SSD-tier pool slots, 73,728 bytes each (default 9,660; more cuts decode misses where memory allows)
  #   DS4_MINIMAX_PREFILL_CHUNK     prefill rows per chunk (default and maximum 4,096)
  #   DS4_MINIMAX_KV_TRACE          per-forward hits, misses, bytes and I/O time of the SSD tier
  #   DS4_MINIMAX_DSPARK_GATE=0     draft on every step, without the rate gate

