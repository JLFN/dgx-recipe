  recipe_file: release.json, recipe id minimax-m31f-vq8-r13x57-r8x20-q4k-nvfp4idx-ssdkv-embssd-v1 (the parts carry the pre-residual id minimax-m31f-vq8-r13x57-q4k-nvfp4idx-ssdkv-embssd-v1, and the reader accepts exactly that pair)

solo_only: true
cluster_only: false
min_nodes: 1
max_nodes: 1

# Where the bytes go, and why, on the reference Spark.
# resident -> /mnt/models (the roomy 953 GB volume): read once at load, then
#             copied to the device, so the volume's speed stops mattering.
# read while serving -> NVMe: the K/V tier, which the launcher steers with
#             DS4_KV_OFFLOAD_DIR, plus (inside the release directory, because the
#             engine reads every part from that one directory) the 2.29 GiB token
#             table, whose rows are read per token, and the 1.62 GiB vision tower,
#             which is mapped on demand for image and video input.
defaults:
  port: 8011
  host: 0.0.0.0
  context: 1048576          # the model's native maximum, served by leaving -c off (MINIMAX31_CTX=
                            # empty is the default). --ctx 524288 is the lighter shape: the K/V tier
                            # falls from 33.75 GiB to 18.13 and the resident index keys from 4.22 GiB
                            # to 2.11; at or below 131072 tokens every page stays resident and no
                            # tier file is created at all.
  banks: 1
  max_seqs: 1               # explicit: the card's 1M plan is 113.95 GiB of the 117.2 GiB the engine sees, so one bank
  mtp_mode: "on"            # the DSpark drafter rides along only when --mtp-draft is above 1
  mtp_draft: 3              # the card's sweep used three proposals per step, and the engine's gate falls back to plain decoding while drafting measures slower
  mem_floor_gb: 4           # the engine's own default, left alone
  vision: true              # the release's vision part is mapped automatically; no flag mounts it
  release_dir: /mnt/models/MiniMax-M3.1-Flash-VQ-GGUF
  kv_offload_dir: $HOME/models/minimax-m31-vq/kv-offload
  state_dir: $HOME/models/minimax-m31-vq

shapes:
  weights_resident_bytes: 111333740672     # 57 expert parts + body-nonexpert + dspark; 103.69 GiB
  sidecar_ssd_bytes: 4192584704            # embed-tokens-bf16 + vision-bf16; 3.90 GiB, read while serving
  kv_index_resident_bytes_at_1m: 4529848320   # 4.22 GiB, NVFP4, 60 layers
  kv_offload_bytes_at_1m: 36238786560      # 33.75 GiB, the unlinked O_DIRECT file, fallocated at bank creation
  kv_offload_bytes_at_512k: 18119393280    # 16.88 GiB at the served 524288 tokens: 4096 blocks x 60 layers x 73,728 bytes
  kv_offload_formula: "one 73,728-byte page per (layer, block) of the served context: (ctx / 128) * 60 * 73728, reserved in full with fallocate at bank creation; nothing at all at or below the 131,072-token resident threshold"
  kv_resident_ctx_default: 131072          # contexts at or below this keep K/V pages resident (4.5 GB per bank)

launch: |
  # Default (the model's native 1M context, serial lane, DSpark drafter, three proposals):
  DS4_SERVER_CONTINUOUS=0 \
  DS4_KV_OFFLOAD_DIR="$HOME/models/minimax-m31-vq/kv-offload" \
  ./ds4-dfm-rs/ds4-server --cuda \
      -m /mnt/models/MiniMax-M3.1-Flash-VQ-GGUF \
      --mtp-mode on --mtp-draft 3 --cont-width 0 \
      --host 0.0.0.0 --port 8011 --model-id minimax-m31-flash-vq
  # No -c: the family follows the model's native 1,048,576. --ctx 524288 is the
  # lighter shape, and 131072 or less keeps every K/V page resident.

  # The installer runs exactly this line:
  #   bash scripts/install-minimax-m31-flash-vq.sh start --daemon
  # The lighter contexts, when the 1M plan's 3.25 GiB of headroom is too thin:
  #   MINIMAX31_CTX=524288 bash scripts/install-minimax-m31-flash-vq.sh start
  #   MINIMAX31_CTX=131072 bash scripts/install-minimax-m31-flash-vq.sh start
  #   MINIMAX31_MTP_MODE=off bash scripts/install-minimax-m31-flash-vq.sh start
  # Without the drafter, which the card measured as the safer 1M shape:
  #   MINIMAX31_MTP_MODE=off bash scripts/install-minimax-m31-flash-vq.sh start

artifacts:
  repository: "Baekpica/MiniMax-M3.1-Flash-VQ-GGUF"
  revision: 2789cbaf1b7dce505d55d6026a67c10e1815c78c
  published: "repository created 2026-10-23T08:57:00Z; the weights landed 2026-10-23T10:57:45Z (74e5a9fd), the card was updated twice on 2026-10-24, and the repository has 4,215 downloads in its last full month"
  files: 227
  parts: 61
  payload_bytes: 115526325376          # the 61 GGUF parts
  payload_gib: 107.59
  listing_bytes: 115610523745          # every file at the pinned revision, 227 files
  part_grouping: "37 R13 expert parts (7 x 1,475,503,488 bytes for layers 03-09 and 30 x 1,475,503,872 for the rest, GVQ1 container 1), 20 R13+8 expert parts of 2,381,629,312 bytes (layers 16, 18-32, 35, 40, 43, 53; container 2, 770 tensors each against 385), body-nonexpert.gguf 6,930,488,832, embed-tokens-bf16.gguf 2,458,387,456, vision-bf16.gguf 1,734,197,248, dspark-q8_0.gguf 2,177,025,024"
  parts_are_not_splits: "These are independent GGUF parts, not numbered splits of one file: each expert part is a complete GGUF for its layer, and the release is opened as a directory (-m takes the directory, and every GGUF in it must be a part release.json declares). Standard llama.cpp, Ollama and Transformers loaders do not read this format."
  resident: "the 57 expert parts plus body-nonexpert.gguf and dspark-q8_0.gguf: 111,333,740,672 bytes (103.69 GiB) copied to the device at open"
  read_while_serving: "embed-tokens-bf16.gguf, whose one 12,288-byte row per token is read by the host from the page cache, and vision-bf16.gguf, mapped at open and streamed layer by layer on the first image or video after a cold start or an eviction, then its page cache dropped"
  sidecars_inside_the_release_directory: "the engine reads every part as a filename inside the release directory and refuses to open a directory holding an undeclared GGUF, so the two read-while-serving parts cannot be relocated by an engine option the way the Engram tables and PLE sidecars of the DeepSeek recipes are. They are 3.90 GiB of the 107.59 GiB payload; the runbook records what moving them would take."
  metadata_files_the_engine_needs: "release.json, files.json, config.json (checked against the engine's embedded contract), tokenizer.json (the BPE tables and the 61 added tokens), tokenizer_config.json and chat_template.jinja (the release's original template, thinking span and XML tool calls), plus every .gguf. SHA256SUMS covers 224 files: the 61 parts, the engine's inputs, the calibration and quality evidence, the tools and the per-layer conversion receipts."
  checksums_file: SHA256SUMS
  checksum_entries: 224                # every part digest in release.json matches its SHA256SUMS line (checked 2026-10-26)
  verification: "the engine verifies every part itself at open: it hashes each part with O_DIRECT reads (16 workers), checks the Q4_K and Q8_0 scales as the bytes stream past, compares the digest against release.json, drops the part's page cache, and only then binds tensors. It also checks the file digest of release.json, files.json, config.json, tokenizer.json, tokenizer_config.json and chat_template.jinja against files.json. The installer's verify action re-runs the release's own SHA256SUMS independently over all 115.53 GB in two tiers: the 61 parts and those six engine inputs strictly, and the documentation (card, RECIPE.md, FORMAT.md, SOURCE.md, licences, conversion metadata) as advisory, because the manifest is not maintained for the second group. README.md is the live case: the manifest lists 21,014 bytes / e2f68289 while the file at the pinned revision is 24,071 bytes / 2493b23c, the author having updated his card on 2026-10-24 after writing SHA256SUMS (verified 2026-10-26 against the Hub). start requires a verification record whose sizes and mtimes match the bytes on disk."
  on_the_reference_box:
    state: "fetched to the reference Spark on 2026-10-26: all 61 parts are there and the payload's digests check out against the release's own SHA256SUMS (its model card's entry is stale upstream and is reported, not fatal). Nothing has been LOADED: the engine on that box predates PR #110's merge into main, and the first start's output is the next thing this recipe needs. The reference checkout here carries origin/feat/add-minimax-vq at fd7192f4, which is what the flags and the lane rule were read against."

