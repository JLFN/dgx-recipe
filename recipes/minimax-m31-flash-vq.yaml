specs:
  artifact: "MiniMax-M3.1-Flash VQ GGUF, recipe minimax-m31f-vq8-r13x57-r8x20-q4k-nvfp4idx-ssdkv-embssd-v1"
  model: "MiniMax's 428B native multimodal MoE: 60 layers (3 dense plus 57 MoE), hidden 6,144, 128 routed experts top-4 (sigmoid plus correction bias, times 2.0) plus one shared expert, expert FFN 3,072, SwiGLU-OAI; GQA 64 query / 4 KV heads x 128 with per-head Gemma QK-norm and partial RoPE (64 of 128 dims, theta 1e7); MiniMax Sparse Attention on every layer; vocabulary 200,064; 413.1B routed-expert weights"
  expert_format: "13-bit on all 57 MoE layers (12-bit code stream plus a 1-bit plane, a 64 KiB E4M3 codebook per layer shared by all 128 experts and gate/up/down, one F16 gain per row); an 8-bit residual stage on the twenty layers the author measured, coded against a 256-entry 2 KiB book. 1.63 bits per weight on 37 layers, 2.63 on 20, 1.98 on average."
  other_precisions: "attention q/k/v/o, shared experts, the dense FFN of layers 0-2 and the output head in Q4_K with per-column calibration importance; the MSA indexer's index_q and index_k in Q8_0; the router and correction bias in F32; every RMSNorm and QK-norm at source precision; the token table BF16 in its own part; the vision tower and projector at source precision BF16."
  msa: "each layer keeps the full history of every position: the index key decides, per query, the 16 best 128-token blocks of each KV head (its own block always selected, every visible block below 17). Selection saves reads, not storage, which is why 37.97 GiB of K/V plus index keys exist at 1M and why the index keys stay resident while the K/V pages do not."
  declared_context: 1048576
  runtime_host: "ds4-server (Rust, native C/CUDA kernels behind it) from ds4-dfm-rs's minimax_m3_vq family; ds4-bench, ds4 and ds4-agent are the same tree"
  hardware: "NVIDIA DGX Spark / ASUS Ascent GX10 (GB10, SM121, aarch64, 121.6 GiB unified memory)"
  training_data_note: "the release's card documents its own calibration (4.18M tokens from the original checkpoint's tokenizer and template, text, images and video) and its reference forward (matching transformers 5.20.2 MiniMaxM3VLDecoderLayer to BF16 rounding)"

limits:
  - "Lossy at about 2.0 bits per routed-expert weight. On assistant turns the release agrees with the original's next token 88.2 percent of the time (KL 0.150); behaviour in long free generation, tool use and 1M-token retrieval has not been measured by anyone. The card's own warning: expect reasoning that loops and text that breaks mid-character or switches language."
  - "The 1M context with the DSpark drafter is not a safe configuration on a 128 GB host by the author's own measurement: 114.75 GiB peak, which let systemd-oomd kill other user scopes. Without the drafter the same 1M run peaked at 110.7 GiB."
  - "Long prompts read K/V from the SSD: at prefill a 2,048-row chunk selects most of the visible blocks, so the prefix's pages are streamed back per chunk. An exact 1,048,319-token prompt took 1,807 s (580 tok/s)."
  - "The SSD tier is a real dependency, not a cache: at 1M the file is 33.75 GiB of an unlinked O_DIRECT file, fallocated before the port binds, so the tier's filesystem must have room and must support O_TMPFILE."
  - "The family's speculation runs on the serial lane: the launcher passes --cont-width 0 and DS4_SERVER_CONTINUOUS=0 while the drafter is armed, because a bank width and --mtp-mode on cannot coexist on a persistent-bank family (the engine refuses the boot with 'minimax_m3_vq MTP runs only on the serial lane (mtp_lane)'). The engine is on main since PR #110 merged on 2026-10-25."
  - "One ds4 model at a time on the box whatever the port says: the engine takes a single global lock."
  - "The weights are under the MiniMax Community License, not MIT: non-commercial use is free, commercial use needs the attribution and the notification the license describes."

notes:
  - "The release must stay a directory, and every GGUF in it must be one release.json declares: -m takes the directory, the parts are independent GGUFs rather than numbered splits, and an undeclared .gguf in the directory makes the open fail."
  - "The launcher sets DS4_KV_OFFLOAD_DIR to the NVMe. The engine's default is ~/.cache/ds4/kv-offload, which on a home-partition Spark puts 36.2 GiB of per-token reads behind whatever else uses that filesystem."
  - "The embedding part is read one 12,288-byte row per token, so a decode step reads about 245 KB/s of it at 20 tok/s, and the vision tower is streamed whole per image (1.7 GB) then dropped from the page cache. Both live in the release directory because the engine reads every part from that one directory; the DeepSeek recipes' separate --engram-dir does not exist on this family."
  - "The family's speculation runs on the serial lane, so the launcher selects that route with --cont-width 0 and DS4_SERVER_CONTINUOUS=0 while the drafter is armed; a bank width and --mtp-mode on cannot coexist on a persistent-bank family and the engine rejects the boot with 'minimax_m3_vq MTP runs only on the serial lane (mtp_lane)'. The pair was the first thing the reference Spark's first start caught."
  - "The DSpark drafter is used only when --mtp-draft is above 1; the family's AUTO mode resolves to off, as it does for the GLM VQ family, so the launcher passes on explicitly. The engine gates drafting on measured rates itself and decodes plainly while a trial runs slower, which is the difference between 18.65 and 19.56 tok/s in the author's sweep."
  - "The drafter's proposals are greedy-only. Its output equals plain decoding token for token, so a mode switch changes speed, never content."
  - "The launcher's post-load floor is the artifact's own thin margin, not a round number: the card's 1M plan is 113.95 GiB of the 117.2 GiB the engine sees, and two consecutive 5 s samples of MemAvailable below 2500 MB stop the server, which beats a box that has started swapping and cannot be typed into."
  - "Ports 8000, 8003, 8005, 8006, 8007, 8008, 8009 and 8010 answer for the other launchers in this home; 8011 is this artifact's."
  - "The vision part ships in the release and is mapped automatically, so images and video work with no flag: up to four media per request, on the serial lane, an image encoding in 1.8 s cold and 0.35 s with the part cached (504x728, 468 rows), a 6 s clip in 0.84 s."
  - "Nothing in this recipe uses the engine's --ssd-streaming expert cache, which is for single-shard non-VQ artifacts and is not this family at all."
