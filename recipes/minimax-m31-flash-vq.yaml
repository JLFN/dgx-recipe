  recipe_author: "Baekpica for the conversion and the ds4-dfm-rs minimax_m3_vq family; YoungAi (github.com/fodelf/YoungAi) for the 8-dim shared-codebook VQ method, the F16 row gains and the bit planes the residual stage builds on"
