  revision: 2b65148d9a95a7768ef2e553823c39149ee18c6b
  release_commit: f1cd8523381bc0086178d6c146e2818f0211f0ed, the commit that first carried the 53 parts; its parts are byte-identical to 2b65148d and to 136fe729 (compared against the Hub's tree API, 2026-10-31), and only README.md and one PNG moved between them
  upstream_model: dealignai/MiMo-V2.6-Flash-RL-UNCENSORED at 0bdb11d7f37d3f6939e53f822c2bff518e4852fa, itself XiaomiMiMo/MiMo-V2.6-Flash-RL at f657ba2f7d24c9adc5730675baaa2d34de878a49 with its refusal behaviour removed at the weight level and no fine-tune, adapter, tokenizer or template change
  sibling_release: Baekpica/MiMo-V2.6-Flash-RL-VQ-GGUF (the same recipe on the aligned original); 38 of this release's 53 parts are that release's bytes, marked shared_with_rl in release.json
  tooling: citation "YoungAi (github.com/fodelf/YoungAi) for the 8-dim shared-codebook VQ method, F16 row gains and bit planes (LICENSE-YoungAi in the release)"; the conversion, calibration and release tools ship in the repository under tools/
  license: "mit (weights; YoungAi notice kept in LICENSE-YoungAi)"

solo_only: true
cluster_only: false
min_nodes: 1
max_nodes: 1

# THE FASTEST MEASURED SETUP, and the reason: decode is bounded by one trunk
# pass per verify, so the only knob that moves it is the drafter. Two embedded
# MTP drafts measured 26.35 tok/s against 23.96 without over 2K-64K, and 35.96 /
# 36.29 / 25.40 against 24.9-25.1 on chat prompts where the drafts are accepted.
# The DFlash drafter is slower on the same hardware (17.4 against 24.2 at 32K on
# raw prose) and banks come with MTP off, so neither belongs in the fast default.
# One serial sequence at 1M is also the only 1M shape that fits: a 1M text bank
# beside the serial media session is 123.2 GiB and is refused.
defaults:
  port: 8012
  host: 0.0.0.0
  context: 1048576
  max_seqs: 1
  lane: serial
  mtp_mode: "on"
  mtp_draft: 2
  prefix_reuse: exact
  banks: 1
  mem_floor_gb: 4
  # A cold start streams the trunk twice: the loader hashes every part with
  # O_DIRECT (release.rs:675 verify_dir -> :557 part_digest) and the device copy
  # then reads it again. Disk placement changes that, not tokens per second.
  gguf_dir: /mnt/models/mimo26-unc
  state_dir: $HOME/models/mimo26-unc
  embedding: "$HOME/models/mimo26-unc/embed/embed-tokens-bf16.gguf, symlinked into the release directory (the only part read while serving)"
  kv_disk_dir: not used by the fast default (the disk K/V store requires banks); when banks are used, <state_dir>/kv

shapes:
  "1m":
    context: 1048576
    banks: 1
    mtp: "on, 2 drafts"
    note: "The default and the fastest measured single-stream shape. The author's --check-config quote is 109.79 GiB of 117.6 GiB available on a GB10 (1M, vision + audio, two MTP drafts). A 1M text bank beside the serial media session is 123.2 GiB and is refused, so 1M is one sequence."
  "1m-dflash":
    context: 1048576
    banks: 1
    mtp: "on, 7 DFlash drafts (--mtp <release>/dflash-q8_0.gguf)"
    note: "110.27 GiB by the author's quote. Slower on raw prose (17.4 against 24.2 tok/s at 32K); kept as the alternative drafter, not as a speed default."
  "512k-bank":
    context: 524288
    banks: 1
    mtp: off
    note: "One text bank plus serial media, 111.77 GiB by the author's quote. For concurrent clients, not for a faster single stream; unmeasured as a throughput shape."
  "256k-two-banks":
    context: 262144
    banks: 2
    mtp: off
    note: "Two text banks plus serial media with --prefix-reuse partial and --kv-disk-dir, 109.89 GiB by the author's quote. The engine's 2026-10-30 gate passed append, fork, edit and branch reuse and restored 640 of 664 tokens from disk; that gate measured correctness, not speed."

launch: |
  # The fast default. Run from anywhere; the launcher is the same line:
  #   bash scripts/install-mimo26-uncensored-vq.sh start
  ./ds4-server --cuda -m /mnt/models/mimo26-unc \
      --mtp-mode on --mtp-draft 2 --max-seqs 1 \
      --host 0.0.0.0 --port 8012 \
      --model-id mimo-v2.6-flash-uncensored-vq --no-update-check

  # No -c is passed: the family's own context is 1,048,576
  # (crates/ds4-core/src/mimo2.rs:21 INDEX_LIMIT).
  # No --vision and no --audio flag: the release's vision-q8_0.gguf and
  # audio-q8_0.gguf load with the model (docs/mimo2-vq.md, "Serving").
  # No DS4_SERVER_CONTINUOUS: the plan publishes it (serving.rs:1721).

  # The DFlash drafter instead of MTP (110.27 GiB, slower on raw prose):
  ./ds4-server --cuda -m /mnt/models/mimo26-unc \
      --mtp /mnt/models/mimo26-unc/dflash-q8_0.gguf --mtp-mode on --mtp-draft 7 \
      --host 0.0.0.0 --port 8012

  # Two text banks, no drafting (concurrency, not speed):
  ./ds4-server --cuda -m /mnt/models/mimo26-unc -c 262144 --max-seqs 2 \
      --mtp-mode off --prefix-reuse partial --kv-disk-dir "$HOME/models/mimo26-unc/kv" \
      --host 0.0.0.0 --port 8012

