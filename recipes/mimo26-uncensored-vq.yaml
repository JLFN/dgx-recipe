recipe_version: "4"
name: mimo26-uncensored-vq
description: "MiMo-V2.6-Flash-RL UNCENSORED VQ: dealignai's refusal-removed 309B omnimodal MoE (15B active) through Baekpica's mimo2-vq8 recipe, as 53 independent GGUF parts in one release directory served by ds4-dfm-rs on the DGX Spark at the artifact's native 1,048,576 context. Routed experts are 13-bit GVQ1 on all 47 MoE layers with an 8-bit GVR8 residual stage on 32 of them (1.63 / 2.63 bpw), the body is Q8_0, vision and audio are Q8_0 sidecars that load with the model, and three embedded MTP blocks draft two tokens per verify. 98,520,657,024 bytes of parts, one serial sequence, 109.79 GiB of the engine's own 117.6 GiB quote. THE FASTEST MEASURED SINGLE-STREAM SETUP IS THIS DEFAULT: 1M serial lane, MTP on at two drafts, no banks, no disk K/V. Nothing has been loaded or timed on the reference Spark for this artifact: every speed and quality number here belongs to the artifact author at engine 2fa8c08e and is labelled as such."
model: /mnt/models/mimo26-unc
# The release is a DIRECTORY of 53 parts, never numbered splits and never
# concatenated: -m takes the directory, and the loader fails on any .gguf inside
# it that release.json does not declare (crates/ds4-core/src/mimo2_vq/release.rs:392).
model_layout: release-directory
runtime: ds4-cuda
engine_repo: https://github.com/Baekpica/ds4-dfm-rs
engine_version: "main, family mimo2_vq: PR #127 merged at 446951cc and the performance PR #128 merged at 35f5b462. Built at 2fa8c08e0229d463340b0823f2b1d54cfad93087, the commit the artifact's own DGX Spark numbers were measured on. This is a FORMAT floor rather than a date: a build older than PR #127 has no mimo2_vq reader at all, and the shape is registered at crates/ds4-core/src/shape.rs:1473 as MiMo-V2.6-Flash-VQ (variant Mimo26FlashVq, architecture mimo2_vq)."
build: make cuda-spark
context: 1048576
banks: 1

# What the launcher sets, and why the server needs no help: the plan resolves
# the serial lane for MTP (crates/ds4-core/src/serving.rs:1721 publishes
# DS4_SERVER_CONTINUOUS=0 from the plan itself), so setting the variable by hand
# can only contradict the plan. Nothing else is exported for this family.
env: {}

