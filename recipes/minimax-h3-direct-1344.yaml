recipe_version: "4"
name: minimax-h3-direct-1344
description: "MiniMax-H3 rendered directly at 1344x768 by the engine's own command-line renderer on one DGX Spark / GB10: no draft, no upscaler, no Latent Transfer Adapter, no LTX refiner, no LTX VAE, no Gemma. The DiT runs at the output canvas itself for 20 steps, the H3 video VAE decodes it, and the original H3 soundtrack is muxed as AAC. Every number here was measured on the reference box on 2026-10-31."
model: /mnt/h3-artifacts/MiniMax-H3
model_layout: partitioned-checkpoint (FL2VA)
runtime: ds4-h3-cuda-cli
engine_repo: "https://github.com/JLFN/ds4-dfm-rs (fork remote; upstream Baekpica/ds4-dfm-rs)"
engine_version: "feat/sol-h3, commits fb81ace2 and ac1be9f3 plus the 2026-10-31 working tree; binary built on the reference box"
build: make CUDA_ARCH=sm_121 h3-rs
context: not_applicable
banks: not_applicable
not_autoregressive: true
api: none

env:
  H3_DIT_SOL: "0.9"          # VSA: 90% sparse attention over 64-token tiles
  H3_VAE_ATTENTION: tensor   # decoder attention kernel
  H3_VAE_GEMM: bf16          # decoder matmul compute mode
  H3_FFMPEG: null            # overrides the muxer binary

metadata:
  author: "${USER}"
  maintainer: "${USER}"
  created: "2026-10-31"
  updated: "2026-10-31"
  tags:
    - minimax
    - minimax-h3
    - video-generation
    - text-to-video
    - text-to-audio-video
    - direct
    - 1344x768
    - bf16
    - ds4
    - cuda
    - spark
    - gb10
  runbook: runbooks/minimax-h3-direct-1344.md
  source: https://huggingface.co/MiniMaxAI/MiniMax-H3
  revision: 42ed227ee7df40d41602854ae760620d6eb651fe
  related:
    - recipes/minimax-h3-cli.yaml
    - recipes/minimax-h3-sol.yaml

solo_only: true
cluster_only: false
min_nodes: 1
max_nodes: 1

defaults:
  model_dir: /mnt/h3-artifacts/MiniMax-H3
  text_encoder: /mnt/h3-artifacts/Comfy-MiniMax-H3/text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
  output: outputs/direct-1344x768.mp4
  width: 1344
  height: 768
  frames: 124
  steps: 20
  seed: 42
  reuse: 1
  guard: "tools/host_memory_guard.py --max-gib 120 --high-gib 120 --reserve-gib 2 --trip-gib 2 --psi-full-limit 0 --timeout 3600"

# Everything this route reads from Hugging Face. Nothing else is downloaded:
# the LTX side (dev transformer, distilled LoRA, video VAE, audio VAE, INT8
# Gemma, INT8 connector), the FastH3 VSA LoRA, the H3 latent upscaler and the
# H3-to-LTX adapter are all absent from this route.
downloads:
  - repo_id: MiniMaxAI/MiniMax-H3
    revision: 42ed227ee7df40d41602854ae760620d6eb651fe
    license: MiniMax-H3 Community License Agreement
    paths:
      - "FL2VA/transformer/*"        # 13 shards + index + config, 66,280,524,863 B
      - "FL2VA/video_vae/source/*"   # model.safetensors 10,415,548,320 B + config
      - "FL2VA/audio_vae/*"          # model.safetensors 605,429,308 B + config
      - "FL2VA/tokenizer/*"          # 11,492,078 B
      - "FL2VA/processor/*"          # 11,498,352 B
      - "FL2VA/model_index.json"     # 719 B
    omitted: "FL2VA/text_encoder/*.safetensors (14 shards, ~65.9 GB): the NVFP4-AWQ encoder below replaces the BF16 one, and --text-nvfp4 never opens that directory (crates/ds4-core/src/minimax_h3/text_forward.rs:270-282)."
  - repo_id: Comfy-Org/MiniMax-H3
    revision: 0543966fbdce5ba05709a8f2031c94bdba629b4a
    license: MiniMax-H3 Community License Agreement
    paths:
      - "text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors"
    bytes: 15687142551
    sha256: 35a88d51044231fe332301d7a62aa81e3f2cba62febeb446e2c1e3e0ef76f2c6

downloads_total_bytes: 93011639328

shapes:
  output: "1344x768, 124 frames at 24 fps = 5.175 s, H.264 video plus AAC 32 kHz stereo"
  frames_grid: "requested frames align up to 5+17n; 124 is already on the grid"
  prompt: "A red fox trots through fresh snow at dawn, crunching footsteps."
  canvas: "the DiT runs at latent 37x48x84; the video VAE decodes to 1344x768 with no resize step"

launch: |
  cd $HOME/ds4-sol-h3
  H3_DIT_SOL=0.9 H3_VAE_ATTENTION=tensor H3_VAE_GEMM=bf16 \
  python3 tools/host_memory_guard.py --max-gib 120 --high-gib 120 \
      --reserve-gib 2 --trip-gib 2 --psi-full-limit 0 --timeout 3600 \
      --log scratch/direct1344.memory.jsonl -- \
      ./h3-rs \
      -d /mnt/h3-artifacts/MiniMax-H3 \
      --text-nvfp4 /mnt/h3-artifacts/Comfy-MiniMax-H3/text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors \
      -p "A red fox trots through fresh snow at dawn, crunching footsteps." \
      --width 1344 --height 768 --frames 124 --steps 20 --seed 42 \
      -o outputs/direct-1344x768.mp4

benchmark:
  measured_here: true
  measured_on: "gx10-e1d2, NVIDIA GB10, aarch64, 121.6 GiB unified memory, one render at a time under tools/host_memory_guard.py; base MiniMax-H3 (non-distilled) at 20 steps, NVFP4-AWQ Qwen3-VL 32B prompt encoder, VSA 0.9"
  measured_at: "2026-10-31, process start 13:22 CET, MP4 written 13:27 CET"
  phases_s:
    text_encode: 15.610
    dit_load: 41.068
    denoise_20_steps: 502.929
    audio_decode: 3.145
    frame_decode: 66.630
    mux: 0.958
    sum_s: 630.340
    wall_s: 631.5
  per_step_s: "25.15 (denoise / 20)"
  output:
    path_on_the_box: /home/leandro/ds4-sol-h3/outputs/direct-1344x768.mp4
    path_from_this_host: "/run/user/1000/gvfs/sftp:host=192.168.1.91,user=leandro/home/leandro/ds4-sol-h3/outputs/direct-1344x768.mp4"
    bytes: 4684968
    sha256: 6cf5a33dfc87ffa0f09485a96f61778d907213d3f6b528e7065eb060e7819844
    ffprobe: "duration 5.175 s; stream 0 h264 1344x768 24/1; stream 1 aac 32000 Hz 2 channels"
    sharpness_lapvar_2s: 17.54
  memory:
    guard_admit_available_gib: 119.30
    minimum_available_gib_observed: 72.79
    psi_full_avg10_percent_max_observed: 3.19
    trip: "not reached; the render completed"
  notes:
    - "One run, warm host and page cache. A receipt, not a repeatable throughput figure."
    - "Sharpness for scale, same frame at 2.0 s, same operator: this direct render 17.54; the upscaled 672x384 draft decoded in H3 space 14.11; the LTX refiner from sigma 0.909375 5.54; the transfer-only decode through the adapter and LTX VAE 3.82; a bicubic 2x of the draft 3.34."
    - "Cost, for comparison: the same clip by the draft route is 4-step denoise 21.4 s + upscaler 2.8 s + H3 decode at 1344x768 60-67 s, with the draft's own ceiling; this direct route pays 502.9 s of denoise for detail the 384p draft does not contain."

not_measured:
  repeat_runs: "no second run at this shape, so no variance figure"
  fast_draft_route: "this recipe is the direct canvas only; the 4-step FastH3 draft plus upscaler is recipes/minimax-h3-cli.yaml and the H3-space decode above"
  ltx_route: "the adapter, refiner and LTX VAE are absent by design here; see docs/minimax-h3/reference-latency-2026-10-31.md for what they do to content"
