recipe_version: "4"
name: minimax-h3-cli
description: "MiniMax-H3 stage-1 clip made by the engine's own command-line renderer on one DGX Spark / GB10, recorded end to end: prompt to MP4 with stereo audio, no HTTP server, no ComfyUI, no apiplant h3-rs. This is the draft stage only. The latent path (x2 upscaler, H3-to-LTX adapter, LTX-2.5 refiner, LTX VAE) is ported and gated in the same tree but is not composed into this run, so the clip below is the DiT's own output decoded by the H3 video VAE. The whole render is 20 denoise evaluations at 512x512 with 56 frames, and every number here was measured on the reference box on 2026-10-31, not borrowed from another host."
model: /mnt/h3-artifacts/MiniMax-H3
model_layout: partitioned-checkpoint
runtime: ds4-h3-cuda-cli
engine_repo: "https://github.com/JLFN/ds4-dfm-rs (fork remote on the reference box; upstream Baekpica/ds4-dfm-rs)"
engine_version: "the feat/sol-h3 tree at 19937e37 on the reference box, with uncommitted working-tree changes (Makefile, crates/ds4-cli/Cargo.toml, crates/ds4-cli/src/bin/h3-rs.rs, crates/ds4-core/src/minimax_h3.rs, and the new crates/ds4-cli/src/bin/h3-sol-rs.rs). The mainstream checkout /home/leandro/ds4-dfm-rs is main at 35f5b462 and was NOT the tree that produced this clip; its own h3-rs binary had been removed by a forced rebuild, which is why the first attempt failed. The binary that ran was the pre-rebuild /home/leandro/ds4-sol-h3/h3-rs (5,946,992 B, built 2026-10-29 17:15) loaded at 10:27:23; the file on disk was replaced at 10:31:04 by a later rebuild (6,900,248 B, sha256 aebc7781c1ee033084293854dbfdbf4184fbd66d5b53dac5abc5e38b8b697465), so that hash is the rebuilt binary, not the one this run used."
build: make CUDA_ARCH=sm_121 h3-rs
context: not_applicable
banks: not_applicable
not_autoregressive: true
api: none

env:
  # The CLI takes flags; nothing needs exporting. H3_FFMPEG overrides the
  # ffmpeg used for the mux.
  H3_FFMPEG: null

metadata:
  author: "${USER}"
  maintainer: "${USER}"
  created: "2026-10-31"
  updated: "2026-10-31"
  tags:
    - minimax
    - minimax-h3
    - h3
    - diffusion-transformer
    - dit
    - video-generation
    - text-to-video
    - text-to-audio-video
    - stage-1
    - cli
    - bf16
    - ds4
    - cuda
    - spark
    - gb10
  runbook: runbooks/minimax-h3-cli.md
  sibling_recipe: recipes/minimax-h3.yaml
  sibling_note: "the server recipe documents the local v1 video API and the checkpoint's full required set; this one records the command-line renderer and its measured clip."
  source: https://huggingface.co/MiniMaxAI/MiniMax-H3
  revision: 42ed227ee7df40d41602854ae760620d6eb651fe

solo_only: true
cluster_only: false
min_nodes: 1
max_nodes: 1

defaults:
  model_dir: /mnt/h3-artifacts/MiniMax-H3
  output: /mnt/h3/fox.mp4
  width: 512
  height: 512
  frames: 56
  steps: 20
  seed: 42
  reuse: 1
  attention: tensor        # the default; scalar is the byte-exact reference path
  vae_attention: scalar    # the decoder's own default
  vae_gemm: fp32           # the decoder's reference rounding
  guard: "tools/host_memory_guard.py --max-gib 120 --high-gib 120 --reserve-gib 2 --trip-gib 2 --psi-full-limit 0 --timeout 1800"
  guard_reason: "the render loads the model into the unified pool; the guard's 2 GiB reserve/trip is the repository's rule for resident-model runs."

shapes:
  output: "512x512, 56 frames at 24 fps = 2.333333 s, H.264 video plus AAC 32 kHz stereo"
  frames_grid: "requested frames align up to 5+17n; 56 is already on the grid"
  prompt: "A red fox trots through fresh snow at dawn, crunching footsteps."
  model_on_the_reference_box: "du -sh reports 207 GiB for /mnt/h3-artifacts/MiniMax-H3; h3-rs --info resolves all five FL2VA components (tokenizer, text_encoder, transformer, video_vae/source, audio_vae) and Ref2VA is present. The engine's documented required set is 210,331,771,721 bytes across 102 files (recipes/minimax-h3.yaml)."
  tensor_attention_note: "this run used the default tensor-core attention, not the byte-exact scalar path; the recorded 139.418 s figure for the same shape belongs to the tensor kernel, and the scalar kernel measured 460.399 s (docs/minimax-h3/README.md:44-50)."

launch: |
  # On the reference box, from the sol-h3 tree (the mainstream tree is not used):
  cd $HOME/ds4-sol-h3
  python3 tools/host_memory_guard.py --max-gib 120 --high-gib 120 \
      --reserve-gib 2 --trip-gib 2 --psi-full-limit 0 --timeout 1800 \
      --log scratch/fox.memory.jsonl -- \
      $HOME/ds4-sol-h3/h3-rs \
      -d /mnt/h3-artifacts/MiniMax-H3 \
      -p "A red fox trots through fresh snow at dawn, crunching footsteps." \
      --width 512 --height 512 --frames 56 --steps 20 --seed 42 \
      -o /mnt/h3/fox.mp4
  #
  # The same binary also writes the handoff files the latent path needs:
  #   --save-latent PATH   raw BF16 [channel][time][height][width], 24 channels
  #   --save-audio PATH    raw little-endian F32 PCM, interleaved
  # Those flags exist in the working tree; they were not used for this clip.

benchmark:
  measured_here: true
  measured_on: "gx10-e1d2, NVIDIA GB10, aarch64, 121.6 GiB unified memory, one render at a time under tools/host_memory_guard.py; binary /home/leandro/ds4-sol-h3/h3-rs (pre-rebuild, 5,946,992 B, 2026-10-29 17:15); model /mnt/h3-artifacts/MiniMax-H3"
  measured_at: "2026-10-31, process start 10:27:23 CET, MP4 written 10:30:11 CET"
  phases_s:
    text_encode: 28.983
    dit_load: 38.835
    denoise_20_steps: 56.672
    audio_decode: 1.552
    frame_decode: 39.747
    mux: 0.962
    sum_s: 166.751
    wall_s: 168.7
  per_step_s: "2.834 (denoise / 20), against the 6.97 implied by the recorded 139.418 s run at the same shape"
  output:
    path_on_the_box: /mnt/h3/fox.mp4
    path_from_this_host: "/run/user/1000/gvfs/sftp:host=192.168.1.91,user=leandro/mnt/h3/fox.mp4"
    bytes: 278232
    sha256: 2bace19f542b2b044b63cf32f04869484b8cbf46d5352b0273ba7a6962a1f35f
    ffprobe: "mov,mp4,m4a,3gp,3g2,mj2; duration 2.333333 s; stream 0 h264 512x512 24/1; stream 1 aac 32000 Hz 2 channels"
    full_decode: "ffmpeg -v error -i /mnt/h3/fox.mp4 -f null - exited 0 with no output (DECODE_OK)"
  memory:
    guard_admit_available_gib: 118.96
    minimum_available_gib_observed: 80.47
    psi_full_avg10_percent_max_observed: 3.39
    trip: "not reached; the render completed"
  notes:
    - "One run, warm host and page cache. It is a receipt, not a repeatable throughput figure."
    - "The denoise figure is lower than the recorded 139.418 s for the same shape; no A/B was run, so the difference is unexplained and must not be read as an optimization."
    - "The binary file was replaced by a rebuild at 10:31:04 while the render was running; the process kept the inode it started with."
    - "No apiplant/h3-rs code, no ComfyUI, and no HTTP server were involved."

not_measured:
  refined_clip: "the x2 upscaler, H3-to-LTX adapter, LTX-2.5 refiner and LTX VAE are ported and gated but not composed into this CLI run; the stage-2 prompt cache build failed on the reference box with 'missing model.layers.0.self_attn.q_proj.comfy_quant' because the Gemma4 file on disk is the BF16 release and the gate expects the INT8 convrot checkpoint."
  release_shape: "672x384x124 drafted, doubled to 1344x768, cropped to 16 latent frames: never run here."
  context: "no context, no KV cache, no token stream, no MTP; none of the LLM launcher numbers apply."
